<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth_guard.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Announcements Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="announcement_admin.css">
</head>
<body class="dashboard-bg">

    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        
        <header class="custom-navbar text-white py-3 px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard_admin.html" class="text-white text-decoration-none fs-4 link-transition" id="backToDashboardBtn" aria-label="Go Back">
                    <i class="bi bi-chevron-left"></i>
                </a>
                <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                    <img src="TSHS_image.png" alt="School Logo" class="school-logo-img">
                </div>
                <div>
                    <h1 class="m-0 fs-4 fw-bold tracking-wide d-inline-block">Announcement</h1>
                    <p class="m-0 micro-text text-white-50 opacity-75 d-none d-sm-block">Stay updated with school news</p>
                </div>
            </div>
            <div class="text-white text-end dashboard-time">
                <div class="small opacity-75" id="liveDate"></div>
                <div class="fs-4 fw-bold m-0" id="liveTime"></div>
            </div>
        </header>

        <main class="container-fluid px-4 py-4 flex-grow-1">
            
            <div class="d-flex justify-content-end gap-2 mb-4">
                <button class="btn btn-create-announcement d-flex align-items-center gap-2 px-3 py-2 fw-semibold" id="toggleFormBtn">
                    <i class="bi bi-plus-lg"></i> Create Announcement
                </button>
                <button class="btn btn-outline-danger d-flex align-items-center gap-2 px-3 py-2 fw-semibold" id="deleteBtn" disabled>
                    <i class="bi bi-trash"></i> Delete
                </button>
            </div>

            <div class="card border-0 shadow-sm rounded-3 p-4 mb-4 creation-drawer d-none" id="creationFormWrapper">
                <div class="badge-form-title mb-3 text-center text-sm-start">
                    <span class="badge bg-mentorae-green px-3 py-2 fs-6 fw-medium">Create Announcement</span>
                </div>
                <form id="announcementForm">
                    <div class="row g-3">
                        <div class="col-12 col-md-5">
                            <label for="inputEvent" class="form-label text-dark fw-semibold text-sm">Event</label>
                            <input type="text" class="form-control custom-input" id="inputEvent" placeholder="E.g., Quarterly Assessment" required>
                        </div>
                        <div class="col-12 col-md-3">
                            <label for="inputAudience" class="form-label text-dark fw-semibold text-sm">Target Audience</label>
                            <select class="form-select custom-input" id="inputAudience">
                                <option value="all" selected>All Users (System-Wide)</option>
                                <option value="student">Students Only</option>
                                <option value="teacher">Teachers Only</option>
                                <option value="parent">Parents Only</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="inputDate" class="form-label text-dark fw-semibold text-sm">Date</label>
                            <input type="date" class="form-control custom-input" id="inputDate" required>
                        </div>
                        <div class="col-12">
                            <label for="inputDesc" class="form-label text-dark fw-semibold text-sm">Brief Description</label>
                            <textarea class="form-control custom-textarea" id="inputDesc" rows="2" placeholder="E.g., 1st Quarter Assessment Schedule" required></textarea>
                        </div>
                        <div class="col-12 d-flex justify-content-end">
                            <button type="submit" class="btn btn-create-announcement d-flex align-items-center gap-2 px-4 py-2 fw-semibold">
                                <i class="bi bi-plus-lg"></i> Create
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Search and Filters Bar for Announcements -->
            <div class="card border-0 shadow-sm p-3 rounded-4 bg-white mb-3 announcement-filter-toolbar">
                <!-- Search Bar Row (Full Width) -->
                <div class="row g-2 align-items-center mb-2">
                    <div class="col-12">
                        <div class="input-group input-group-sm announcement-search-group">
                            <span class="input-group-text bg-white border-end-0 text-muted ps-2.5 pe-1.5"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control border-start-0 border-end-0 ps-1" id="announcementSearchInput" placeholder="Search announcements by title, keyword, or audience...">
                            <button class="btn btn-outline-secondary border-start-0 text-muted d-none" type="button" id="btnAnnouncementSearchClear" title="Clear Search">
                                <i class="bi bi-x-circle-fill"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <!-- Dropdown Filters and Reset Row -->
                <div class="row g-2 align-items-center">
                    <div class="col-6 col-md-4">
                        <select class="form-select form-select-sm announcement-filter-select" id="announcementFilterType" aria-label="Filter Type">
                            <option value="all" selected>All Types</option>
                            <option value="academic">Academic</option>
                            <option value="seminar">Seminar &amp; Workshop</option>
                            <option value="event">General Event</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-3">
                        <select class="form-select form-select-sm announcement-filter-select" id="announcementFilterAudience" aria-label="Filter Target Audience">
                            <option value="all" selected>All Audiences</option>
                            <option value="all-users">All Users</option>
                            <option value="student">Students</option>
                            <option value="teacher">Teachers</option>
                            <option value="parent">Parents</option>
                        </select>
                    </div>
                    <div class="col-8 col-md-3">
                        <select class="form-select form-select-sm announcement-filter-select" id="announcementFilterDate" aria-label="Filter Event Timeline">
                            <option value="all" selected>All Dates</option>
                            <option value="upcoming">Upcoming Events</option>
                            <option value="past">Past Events</option>
                            <option value="this-month">This Month</option>
                        </select>
                    </div>
                    <div class="col-4 col-md-2 text-end">
                        <button type="button" class="btn btn-sm btn-outline-secondary w-100 fw-semibold d-inline-flex align-items-center justify-content-center gap-1" id="btnAnnouncementResetFilters" title="Reset Filters">
                            <i class="bi bi-arrow-counterclockwise"></i> <span>Reset</span>
                        </button>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-2.5 pt-2 border-top micro-text text-muted flex-wrap gap-2">
                    <div class="d-flex align-items-center gap-1.5">
                        <i class="bi bi-funnel-fill text-success"></i>
                        <span id="announcementResultsCounter" class="fw-semibold text-dark">Showing all announcements</span>
                    </div>
                    <div id="announcementActiveFiltersBadges" class="d-flex gap-1 flex-wrap"></div>
                </div>
            </div>

            <div class="d-flex flex-column gap-3" id="announcementsFeed">
                </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="session.js"></script>
    <script src="announcement_admin.js"></script>
</body>
</html>
