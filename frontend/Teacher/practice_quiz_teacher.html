<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Practice Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="subject_detail_teacher.css">
</head>
<body class="dashboard-bg">

    <!-- Bounded Page Wrapper -->
    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        
        <!-- Header Ribbon Navbar -->
        <nav class="navbar navbar-dark custom-navbar py-3 border-bottom">
            <div class="container-fluid px-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-3">
                    <a href="#" class="text-white text-decoration-none fs-4 link-transition" id="backBtn" aria-label="Go Back">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                    <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                        <img src="../TSHS_image.png" alt="School Logo" class="school-logo-img">
                    </div>
                    <div>
                        <h1 class="navbar-brand m-0 fs-4 fw-bold tracking-wide d-inline-block" id="pageTitle">Practice Quiz</h1>
                        <p class="m-0 micro-text text-white-50 opacity-75 d-none d-sm-block" id="pageSubtitle">Topic: Loading...</p>
                    </div>
                </div>
                <div class="text-white text-end dashboard-time">
                    <div class="small opacity-75" id="liveDate"></div>
                    <div class="fs-4 fw-bold m-0" id="liveTime"></div>
                </div>
            </div>
        </nav>

        <!-- Main Content Workspace Fill -->
        <main class="container-fluid px-4 py-4 flex-grow-1 workspace-content-fill">
            <div class="card border-0 shadow-sm p-4 mb-4">
                <h2 class="h5 fw-bold text-dark mb-3" id="quizTopicTitle">Quiz Builder for...</h2>
                
                <!-- Add/Edit Question Form -->
                <form id="quizForm" class="mb-4 p-3 border rounded bg-light">
                    <input type="hidden" id="questionId">
                    <div class="mb-3">
                        <label for="questionText" class="form-label fw-bold">Question</label>
                        <textarea class="form-control" id="questionText" rows="2" required placeholder="Enter the question text..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Options</label>
                        <div class="input-group mb-2"><span class="input-group-text">A</span><input type="text" class="form-control" id="optionA" placeholder="Option A" required></div>
                        <div class="input-group mb-2"><span class="input-group-text">B</span><input type="text" class="form-control" id="optionB" placeholder="Option B" required></div>
                        <div class="input-group mb-2"><span class="input-group-text">C</span><input type="text" class="form-control" id="optionC" placeholder="Option C"></div>
                        <div class="input-group mb-2"><span class="input-group-text">D</span><input type="text" class="form-control" id="optionD" placeholder="Option D"></div>
                    </div>
                    <div class="mb-3">
                        <label for="correctAnswer" class="form-label fw-bold">Correct Answer</label>
                        <select class="form-select" id="correctAnswer" required>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display: none;">Cancel Edit</button>
                        <button type="submit" class="btn btn-primary" id="addOrUpdateBtn">Add Question</button>
                    </div>
                </form>

                <!-- List of Questions -->
                <h3 class="h6 fw-bold text-dark mb-3">Quiz Questions</h3>
                <div id="questionList" class="d-flex flex-column gap-3"></div>
            </div>
        </main>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const SUBJECTS_STORAGE_KEY = 'mentorae-subjects-data';
            const urlParams = new URLSearchParams(window.location.search);
            const subjectName = urlParams.get('subject');
            const topicName = urlParams.get('topic');

            const decodedSubject = subjectName ? decodeURIComponent(subjectName) : 'Subject';
            const decodedTopic = topicName ? decodeURIComponent(topicName) : 'Topic';

            // Update titles and back button
            document.title = `Mentorae - Quiz: ${decodedTopic}`;
            document.getElementById('pageSubtitle').textContent = `Topic: ${decodedTopic}`;
            document.getElementById('quizTopicTitle').textContent = `Practice Quiz for ${decodedTopic}`;
            
            const backBtn = document.getElementById('backBtn');
            backBtn.href = `subject_detail_teacher.html?subject=${encodeURIComponent(subjectName || '')}`;

            let allSubjects = [];
            let currentSubject = null;
            let currentTopic = null;

            const quizForm = document.getElementById('quizForm');
            const questionList = document.getElementById('questionList');
            const addOrUpdateBtn = document.getElementById('addOrUpdateBtn');
            const cancelEditBtn = document.getElementById('cancelEditBtn');

            function loadData() {
                const storedSubjects = localStorage.getItem(SUBJECTS_STORAGE_KEY);
                allSubjects = storedSubjects ? JSON.parse(storedSubjects) : [];
                currentSubject = allSubjects.find(s => s.name === decodedSubject);
                if (currentSubject) {
                    // Defensively ensure the topics array exists.
                    if (!currentSubject.topics) {
                        currentSubject.topics = [];
                    }
                    currentTopic = currentSubject.topics.find(t => t.title === decodedTopic);
                    if (currentTopic && !currentTopic.quiz) {
                        currentTopic.quiz = []; // Ensure quiz array exists
                    }
                }
            }

            function saveData() {
                const subjectIndex = allSubjects.findIndex(s => s.name === decodedSubject);
                if (subjectIndex !== -1) {
                    allSubjects[subjectIndex] = currentSubject;
                    localStorage.setItem(SUBJECTS_STORAGE_KEY, JSON.stringify(allSubjects));
                }
            }

            function renderQuestions() {
                questionList.innerHTML = '';
                if (currentTopic && currentTopic.quiz && currentTopic.quiz.length > 0) {
                    currentTopic.quiz.forEach((q, index) => {
                        // --- Data Normalization ---
                        // This handles both the admin format {question, options:[], correctAnswer}
                        // and the teacher format {text, options:{}, answer}
                        const questionText = q.text || q.question;
                        let questionOptions = {};
                        let questionAnswer = '';

                        if (Array.isArray(q.options)) {
                            // This is the old admin format, convert it for display
                            const optionKeys = ['A', 'B', 'C', 'D'];
                            q.options.forEach((opt, i) => {
                                if (opt) questionOptions[optionKeys[i]] = opt;
                            });
                            questionAnswer = optionKeys[q.correctAnswer - 1];
                        } else {
                            // This is the correct/teacher format
                            questionOptions = q.options;
                            questionAnswer = q.answer;
                        }

                        const questionCard = document.createElement('div');
                        questionCard.className = 'card';
                        questionCard.innerHTML = `
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <p class="fw-bold">${index + 1}. ${questionText}</p>
                                    <div>
                                        <button class="btn btn-sm btn-outline-primary edit-btn" data-index="${index}"><i class="bi bi-pencil"></i></button>
                                        <button class="btn btn-sm btn-outline-danger delete-btn" data-index="${index}"><i class="bi bi-trash"></i></button>
                                    </div>
                                </div>
                                <ul class="list-unstyled">
                                    ${Object.entries(questionOptions).map(([key, value]) => value ? `<li><strong>${key}:</strong> ${value} ${key === questionAnswer ? '<i class="bi bi-check-circle-fill text-success"></i>' : ''}</li>` : '').join('')}
                                </ul>
                            </div>
                        `;
                        questionList.appendChild(questionCard);
                    });
                } else {
                    questionList.innerHTML = '<p class="text-muted text-center">No questions have been added to this quiz yet.</p>';
                }
            }

            function resetForm() {
                quizForm.reset();
                document.getElementById('questionId').value = '';
                addOrUpdateBtn.textContent = 'Add Question';
                cancelEditBtn.style.display = 'none';
            }

            quizForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (!currentTopic) return;

                const questionData = {
                    text: document.getElementById('questionText').value,
                    options: {
                        A: document.getElementById('optionA').value,
                        B: document.getElementById('optionB').value,
                        C: document.getElementById('optionC').value,
                        D: document.getElementById('optionD').value,
                    },
                    answer: document.getElementById('correctAnswer').value
                };

                const questionId = document.getElementById('questionId').value;
                if (questionId !== '') {
                    currentTopic.quiz[questionId] = questionData;
                } else {
                    currentTopic.quiz.push(questionData);
                }
                saveData();
                renderQuestions();
                resetForm();
            });

            questionList.addEventListener('click', (e) => {
                const index = e.target.closest('button')?.dataset.index;
                if (index === undefined) return;

                if (e.target.closest('.edit-btn')) {
                    let q = currentTopic.quiz[index];

                    // --- Data Normalization for Form Population ---
                    const questionText = q.text || q.question;
                    let questionOptions = {};
                    let questionAnswer = '';

                    if (Array.isArray(q.options)) {
                        // Old admin format
                        const optionKeys = ['A', 'B', 'C', 'D'];
                        q.options.forEach((opt, i) => {
                            if (opt) questionOptions[optionKeys[i]] = opt;
                        });
                        questionAnswer = optionKeys[q.correctAnswer - 1];
                    } else {
                        // Correct teacher format
                        questionOptions = q.options;
                        questionAnswer = q.answer;
                    }

                    document.getElementById('questionId').value = index;
                    document.getElementById('questionText').value = questionText;
                    document.getElementById('optionA').value = questionOptions.A || '';
                    document.getElementById('optionB').value = questionOptions.B || '';
                    document.getElementById('optionC').value = questionOptions.C || '';
                    document.getElementById('optionD').value = questionOptions.D || '';
                    document.getElementById('correctAnswer').value = questionAnswer;
                    addOrUpdateBtn.textContent = 'Update Question';
                    cancelEditBtn.style.display = 'inline-block';
                } else if (e.target.closest('.delete-btn')) {
                    if (confirm('Are you sure you want to delete this question?')) {
                        currentTopic.quiz.splice(index, 1);
                        saveData();
                        renderQuestions();
                    }
                }
            });

            cancelEditBtn.addEventListener('click', resetForm);

            function updateDateTime() {
                document.getElementById('liveDate').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                document.getElementById('liveTime').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
            }
            updateDateTime();
            setInterval(updateDateTime, 1000);

            // Initial Load
            loadData();
            renderQuestions();
        });
    </script>
</body>
</html>
