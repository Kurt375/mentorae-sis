<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Awarding Student with Badges</title>
    <style>body { display: none !important; }</style>
    <script>
        (function() {
            try {
                var token = localStorage.getItem('mentorae_token');
                var user = JSON.parse(localStorage.getItem('mentorae_user') || 'null');
                var role = user && user.role ? String(user.role).toLowerCase() : '';
                if (!token || !user) {
                    window.location.replace('../login.html');
                    return;
                }
                if (role !== 'teacher' && role !== 'admin') {
                    // Access Denied for students
                    window.location.replace('../unauthorized.html');
                    return;
                }
                // Authorized teacher: redirect to award badges section in Class Management
                window.location.replace('class_management_teacher.html#giveBadgesSection');
            } catch (e) {
                window.location.replace('../login.html');
            }
        })();
    </script>
</head>
<body>
</body>
</html>
