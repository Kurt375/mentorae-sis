<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - File Viewer</title>
    <!-- Bootstrap 5.3.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="subject_detail_teacher.css">
</head>

<body class="dashboard-bg">

    <!-- Bounded Page Wrapper -->
    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">

        <!-- Header Ribbon Navbar -->
        <nav class="navbar navbar-dark custom-navbar py-3 border-bottom">
            <div class="container-fluid px-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-3">
                    <a href="#" class="text-white text-decoration-none fs-4 link-transition" id="backBtn"
                        aria-label="Go Back">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                    <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                        <img src="../TSHS_image.png" alt="School Logo" class="school-logo-img">
                    </div>
                    <div>
                        <h1 class="navbar-brand m-0 fs-4 fw-bold tracking-wide d-inline-block" id="pageTitle">File
                            Viewer</h1>
                        <p class="m-0 micro-text text-white-50 opacity-75 d-none d-sm-block" id="pageSubtitle">Topic:
                            Loading...</p>
                    </div>
                </div>
                <div class="text-white text-end dashboard-time">
                    <div class="small opacity-75" id="liveDate"></div>
                    <div class="fs-4 fw-bold m-0" id="liveTime"></div>
                </div>
            </div>
        </nav>

        <!-- Main Content Workspace Fill -->
        <main class="container-fluid px-4 py-4 flex-grow-1 workspace-content-fill">
            <div class="card border-0 shadow-sm p-4">
                <h2 class="h5 fw-bold text-dark mb-3" id="fileTopicTitle">Files for...</h2>

                <!-- File Upload Section -->
                <div class="card bg-light border-dashed p-4 mb-4 text-center" id="dropZone">
                    <i class="bi bi-upload fs-1 text-secondary"></i>
                    <p class="mt-2 text-muted mb-1">Drag & drop files here or click to browse</p>
                    <p class="micro-text text-secondary mb-3">Allowed: PDF, Word (.docx), Images, MP4 (Max 35MB). <em>PowerPoint (.pptx) must be saved as PDF first.</em></p>
                    <input type="file" id="fileUploadInput" class="d-none" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.csv,.mp4,.webm,.png,.jpg,.jpeg,.webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,video/mp4,image/*" multiple>
                    <button class="btn btn-success" id="browseFilesBtn"><i class="bi bi-folder2-open me-2"></i>Browse
                        Files</button>
                </div>

                <!-- Uploaded Files List -->
                <h3 class="h6 fw-bold text-dark mb-3">Uploaded Files</h3>
                <ul class="list-group" id="fileList">
                    <!-- Files will be dynamically inserted here -->
                </ul>
            </div>
        </main>
    </div>

    <!-- Google Classroom Style Full-Screen File Viewer -->
    <div id="classroomFileViewer" class="classroom-viewer-overlay d-none">
        <!-- Top App Bar -->
        <header class="classroom-viewer-header d-flex justify-content-between align-items-center px-4 py-2.5">
            <div class="d-flex align-items-center gap-3 text-truncate">
                <button type="button" class="btn btn-dark rounded-circle p-2 d-flex align-items-center justify-content-center border-0 text-white-50" id="classroomViewerBackBtn" title="Back to Files">
                    <i class="bi bi-arrow-left fs-5 text-white"></i>
                </button>
                <div class="d-flex align-items-center gap-2.5 text-truncate">
                    <div class="classroom-viewer-icon-box" id="classroomViewerIconBox">
                        <i class="bi bi-file-earmark-text fs-4 text-warning" id="classroomViewerIcon"></i>
                    </div>
                    <div class="text-truncate">
                        <h1 class="fs-6 fw-bold text-white mb-0 text-truncate" id="classroomViewerFileName">Document.pdf</h1>
                        <div class="micro-text text-white-50 text-truncate" id="classroomViewerSubtitle">Mentorae Learning Materials</div>
                    </div>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <div id="classroomViewerModeSwitcher" class="d-none d-md-flex align-items-center gap-1 bg-black bg-opacity-40 p-1 rounded-pill border border-secondary border-opacity-50 me-1"></div>
                <button type="button" class="btn btn-sm btn-outline-light rounded-pill px-3 py-1.5 fw-semibold d-none d-sm-inline-flex align-items-center gap-1.5" id="classroomViewerPrintBtn" title="Print document">
                    <i class="bi bi-printer"></i> Print
                </button>
                <a href="#" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-light rounded-pill px-3 py-1.5 fw-semibold d-inline-flex align-items-center gap-1.5" id="classroomViewerPopoutBtn" title="Open in new window">
                    <i class="bi bi-box-arrow-up-right"></i> <span class="d-none d-md-inline">Pop-out</span>
                </a>
                <a href="#" download class="btn btn-sm btn-primary rounded-pill px-3.5 py-1.5 fw-bold d-inline-flex align-items-center gap-1.5 shadow-sm" id="classroomViewerDownloadBtn" title="Download to device">
                    <i class="bi bi-download"></i> Download
                </a>
                <button type="button" class="btn btn-dark rounded-circle p-2 d-flex align-items-center justify-content-center border-0 text-white ms-1" id="classroomViewerCloseBtn" title="Close">
                    <i class="bi bi-x-lg fs-5"></i>
                </button>
            </div>
        </header>

        <!-- Main Workspace (Center Document Stage) -->
        <div class="classroom-viewer-stage" id="classroomViewerStage">
            <!-- Dynamic high-fidelity content rendered here -->
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.4/dist/docx-preview.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script src="../presentationOptimizer.js"></script>
    <script src="../pptxToPdf.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const SUBJECTS_STORAGE_KEY = 'mentorae-subjects-data';
            const urlParams = new URLSearchParams(window.location.search);
            const subjectName = urlParams.get('subject');
            const topicName = urlParams.get('topic');

            const decodedSubject = subjectName ? decodeURIComponent(subjectName) : 'Subject';
            const decodedTopic = topicName ? decodeURIComponent(topicName) : 'Topic';

            // Update titles and back button
            document.title = `Mentorae - Files: ${decodedTopic}`;
            const pageSubtitle = document.getElementById('pageSubtitle');
            if (pageSubtitle) pageSubtitle.textContent = `Topic: ${decodedTopic}`;

            const fileTopicTitle = document.getElementById('fileTopicTitle');
            if (fileTopicTitle) fileTopicTitle.textContent = `Files for ${decodedTopic}`;

            const backBtn = document.getElementById('backBtn');
            if (backBtn) {
                backBtn.href = `subject_detail_teacher.html?subject=${encodeURIComponent(subjectName || '')}`;
            }

            let allSubjects = [];
            let currentSubject = null;
            let currentTopic = null;

            async function loadData() {
                const storedSubjects = localStorage.getItem(SUBJECTS_STORAGE_KEY);
                allSubjects = storedSubjects ? JSON.parse(storedSubjects) : [];
                currentSubject = allSubjects.find(s => s.name === decodedSubject);
                if (currentSubject) {
                    if (!currentSubject.topics) {
                        currentSubject.topics = [];
                    }
                    const allContent = [...(currentSubject.topics || []), ...(currentSubject.recommendations || [])];
                    currentTopic = allContent.find(t => t.title === decodedTopic);
                    if (currentTopic && !currentTopic.files) {
                        currentTopic.files = [];
                    }
                }

                if (!currentTopic && decodedSubject) {
                    try {
                        const token = localStorage.getItem('mentorae_token');
                        if (token) {
                            const data = await authedFetch(`/api/content/topics?subjectName=${encodeURIComponent(decodedSubject)}`, token);
                            if (data && data.success) {
                                const allContent = [...(data.topics || []), ...(data.recommendations || [])];
                                currentTopic = allContent.find(t => t.title === decodedTopic);
                                if (currentTopic && !currentTopic.files) currentTopic.files = [];
                            }
                        }
                    } catch (e) {
                        console.error('Failed to load topic files from DB:', e);
                    }
                }

                renderFileList();
            }

            function saveData() {
                const subjectIndex = allSubjects.findIndex(s => s.name === decodedSubject);
                if (subjectIndex !== -1) {
                    allSubjects[subjectIndex] = currentSubject;
                    localStorage.setItem(SUBJECTS_STORAGE_KEY, JSON.stringify(allSubjects));
                }
            }

            function getMimeTypeFromFilename(filename, fallbackMime) {
                if (!filename) return fallbackMime || 'application/octet-stream';
                const ext = filename.split('.').pop().toLowerCase();
                const mimeMap = {
                    'pdf': 'application/pdf',
                    'png': 'image/png',
                    'jpg': 'image/jpeg',
                    'jpeg': 'image/jpeg',
                    'gif': 'image/gif',
                    'webp': 'image/webp',
                    'svg': 'image/svg+xml',
                    'txt': 'text/plain',
                    'md': 'text/plain',
                    'html': 'text/html',
                    'htm': 'text/html',
                    'json': 'application/json',
                    'csv': 'text/plain',
                    'mp4': 'video/mp4',
                    'webm': 'video/webm',
                    'mp3': 'audio/mpeg',
                    'wav': 'audio/wav',
                    'docx': 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
                    'doc': 'application/msword',
                    'pptx': 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
                    'ppt': 'application/vnd.ms-powerpoint',
                    'xlsx': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                    'xls': 'application/vnd.ms-excel'
                };
                return mimeMap[ext] || fallbackMime || 'application/octet-stream';
            }

            function dataURItoBlob(dataURI, filename = '') {
                if (!dataURI || !dataURI.includes(',')) return null;
                try {
                    var parts = dataURI.split(',');
                    var byteString = atob(parts[1]);
                    var mimeString = parts[0].split(':')[1]?.split(';')[0];
                    if (!mimeString || mimeString === 'application/octet-stream') {
                        mimeString = getMimeTypeFromFilename(filename, mimeString);
                    }
                    var ab = new ArrayBuffer(byteString.length);
                    var ia = new Uint8Array(ab);
                    for (var i = 0; i < byteString.length; i++) {
                        ia[i] = byteString.charCodeAt(i);
                    }
                    return new Blob([ab], { type: mimeString });
                } catch (e) {
                    console.error('Error converting data URI to blob:', e);
                    return null;
                }
            }

            function getResolvedFileUrl(fileObj, fallbackUrl = '', topicTitle = '') {
                let raw = '';
                const token = localStorage.getItem('mentorae_token') || '';
                const apiBase = (window.MENTORAE_CONFIG?.API_BASE_URL || window.API_BASE || '').replace(/\/+$/, '');

                if (fileObj) {
                    if (typeof fileObj === 'string') {
                        raw = fileObj;
                    } else {
                        raw = fileObj.dataUrl || fileObj.url || fileObj.file_path || fileObj.filePath || fileObj.path || fileObj.pdfDataUrl || fileObj.pdfUrl || '';
                        if (!raw && fileObj.topicId !== undefined && fileObj.fileIndex !== undefined) {
                            raw = `/api/content/topics/${fileObj.topicId}/files/${fileObj.fileIndex}/download`;
                        } else if (!raw && fileObj.id) {
                            raw = `/api/resources/files/${fileObj.id}/download`;
                        } else if (!raw && fileObj.name && decodedSubject) {
                            raw = `/api/content/topics/file-by-name?subjectName=${encodeURIComponent(decodedSubject)}&topicTitle=${encodeURIComponent(topicTitle || '')}&fileName=${encodeURIComponent(fileObj.name)}`;
                        }
                    }
                }
                if (!raw) raw = fallbackUrl || '';
                if (!raw) return '';

                if (raw.startsWith('data:') || raw.startsWith('blob:')) {
                    return raw;
                }

                let fullUrl = raw;
                if (!/^https?:\/\//i.test(fullUrl)) {
                    const cleanPath = fullUrl.startsWith('/') ? fullUrl : `/${fullUrl}`;
                    fullUrl = `${apiBase}${cleanPath}`;
                }

                if (token && fullUrl.includes('/api/') && !fullUrl.includes('token=')) {
                    const separator = fullUrl.includes('?') ? '&' : '?';
                    fullUrl = `${fullUrl}${separator}token=${encodeURIComponent(token)}`;
                }

                if (fileObj && typeof fileObj === 'object' && fileObj.name && fullUrl.includes('/api/content/topics/') && !fullUrl.includes('name=')) {
                    const separator = fullUrl.includes('?') ? '&' : '?';
                    fullUrl = `${fullUrl}${separator}name=${encodeURIComponent(fileObj.name)}`;
                }

                return fullUrl;
            }

            let currentViewerActiveBlobUrl = null;

            function closeClassroomViewer() {
                const viewerEl = document.getElementById('classroomFileViewer');
                const stageEl = document.getElementById('classroomViewerStage');
                const modeSwitcherEl = document.getElementById('classroomViewerModeSwitcher');

                if (viewerEl) viewerEl.classList.add('d-none');
                document.documentElement.style.overflow = '';
                document.body.style.overflow = '';
                if (stageEl) stageEl.innerHTML = '';
                if (modeSwitcherEl) modeSwitcherEl.innerHTML = '';

                if (currentViewerActiveBlobUrl && currentViewerActiveBlobUrl.startsWith('blob:')) {
                    try { URL.revokeObjectURL(currentViewerActiveBlobUrl); } catch (e) {}
                    currentViewerActiveBlobUrl = null;
                }
            }

            async function openClassroomViewer(fileName, dataUrl, topicTitle = decodedTopic, targetFile = null) {
                const viewerEl = document.getElementById('classroomFileViewer');
                const nameEl = document.getElementById('classroomViewerFileName');
                const subEl = document.getElementById('classroomViewerSubtitle');
                const iconEl = document.getElementById('classroomViewerIcon');
                const stageEl = document.getElementById('classroomViewerStage');
                const downloadBtn = document.getElementById('classroomViewerDownloadBtn');
                const popoutBtn = document.getElementById('classroomViewerPopoutBtn');
                const printBtn = document.getElementById('classroomViewerPrintBtn');
                const modeSwitcherEl = document.getElementById('classroomViewerModeSwitcher');

                if (!viewerEl || !stageEl) return;

                if (currentViewerActiveBlobUrl && currentViewerActiveBlobUrl.startsWith('blob:')) {
                    try { URL.revokeObjectURL(currentViewerActiveBlobUrl); } catch (e) {}
                    currentViewerActiveBlobUrl = null;
                }

                viewerEl.classList.remove('d-none');
                document.documentElement.style.overflow = 'hidden';
                document.body.style.overflow = 'hidden';

                const closeBtn = document.getElementById('classroomViewerCloseBtn');
                const backBtn = document.getElementById('classroomViewerBackBtn');
                if (closeBtn) closeBtn.onclick = closeClassroomViewer;
                if (backBtn) backBtn.onclick = closeClassroomViewer;

                if (nameEl) nameEl.textContent = fileName || 'Document';
                if (subEl) subEl.textContent = `${decodedSubject || 'Subject'} • ${topicTitle || 'Learning Materials'}`;

                const ext = (fileName || '').split('.').pop().toLowerCase();
                let mime = getMimeTypeFromFilename(fileName, '');

                if (iconEl) {
                    if (ext === 'pdf') {
                        iconEl.className = 'bi bi-file-earmark-pdf fs-4 text-danger';
                    } else if (ext === 'pptx' || ext === 'ppt') {
                        iconEl.className = 'bi bi-file-earmark-slides fs-4 text-warning';
                    } else if (ext === 'docx' || ext === 'doc') {
                        iconEl.className = 'bi bi-file-earmark-word fs-4 text-primary';
                    } else if (ext === 'xlsx' || ext === 'xls' || ext === 'csv') {
                        iconEl.className = 'bi bi-file-earmark-excel fs-4 text-success';
                    } else if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg'].includes(ext)) {
                        iconEl.className = 'bi bi-file-earmark-image fs-4 text-info';
                    } else if (['mp4', 'webm', 'ogg'].includes(ext)) {
                        iconEl.className = 'bi bi-file-earmark-play fs-4 text-danger';
                    } else if (['mp3', 'wav', 'm4a'].includes(ext)) {
                        iconEl.className = 'bi bi-file-earmark-music fs-4 text-primary';
                    } else {
                        iconEl.className = 'bi bi-file-earmark-text fs-4 text-light';
                    }
                }

                stageEl.innerHTML = `
                    <div class="d-flex flex-column align-items-center justify-content-center w-100 h-100 text-white">
                        <div class="spinner-border text-primary mb-3" style="width: 3.2rem; height: 3.2rem;" role="status"></div>
                        <p class="fs-5 fw-semibold mb-1">Loading Document Preview...</p>
                        <p class="text-white-50 small">${fileName || 'Please wait'}</p>
                    </div>
                `;
                if (modeSwitcherEl) modeSwitcherEl.innerHTML = '';

                const resolvedUrl = getResolvedFileUrl(targetFile, dataUrl, topicTitle);
                let blob = null;
                let blobUrl = resolvedUrl;
                let arrayBuffer = null;

                if (resolvedUrl && resolvedUrl.startsWith('data:')) {
                    blob = dataURItoBlob(resolvedUrl, fileName);
                    if (blob) {
                        blobUrl = URL.createObjectURL(blob);
                        currentViewerActiveBlobUrl = blobUrl;
                        if (blob.type) mime = blob.type;
                        try { arrayBuffer = await blob.arrayBuffer(); } catch(e){}
                    }
                } else if (resolvedUrl && resolvedUrl.startsWith('blob:')) {
                    blobUrl = resolvedUrl;
                    currentViewerActiveBlobUrl = blobUrl;
                } else if (resolvedUrl && /^https?:\/\//i.test(resolvedUrl)) {
                    try {
                        const token = localStorage.getItem('mentorae_token');
                        const headers = {};
                        if (token && resolvedUrl.includes('/api/')) {
                            headers['Authorization'] = `Bearer ${token}`;
                        }
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 12000);
                        try {
                            const res = await fetch(resolvedUrl, { headers, signal: controller.signal });
                            if (res.ok) {
                                blob = await res.blob();
                                blobUrl = URL.createObjectURL(blob);
                                currentViewerActiveBlobUrl = blobUrl;
                                arrayBuffer = await blob.arrayBuffer();
                            }
                        } finally {
                            clearTimeout(timeoutId);
                        }
                    } catch(e) {}
                }

                const activeUrl = blobUrl || resolvedUrl;

                if (downloadBtn) {
                    downloadBtn.href = activeUrl;
                    downloadBtn.setAttribute('download', fileName || 'lesson_file');
                }
                if (popoutBtn) {
                    popoutBtn.href = activeUrl;
                    popoutBtn.target = '_blank';
                }
                if (printBtn) {
                    printBtn.onclick = () => {
                        const ifr = stageEl.querySelector('iframe');
                        if (ifr && ifr.contentWindow) {
                            try { ifr.contentWindow.print(); return; } catch (e) {}
                        }
                        const printWindow = window.open(activeUrl);
                        if (printWindow) {
                            printWindow.addEventListener('load', () => printWindow.print(), { once: true });
                        } else {
                            window.print();
                        }
                    };
                }

                // 1. PDF
                if (ext === 'pdf' || mime.includes('pdf')) {
                    stageEl.innerHTML = `
                        <object data="${activeUrl}" type="application/pdf" class="w-100 h-100 border-0" style="background: #525659;">
                            <iframe src="${activeUrl}" class="w-100 h-100 border-0" title="${fileName}" style="background: #525659;">
                                <div class="p-5 text-center text-white">
                                    <p class="mb-3">Unable to display PDF inline.</p>
                                    <a href="${activeUrl}" target="_blank" class="btn btn-danger rounded-pill px-4">Open PDF</a>
                                </div>
                            </iframe>
                        </object>
                    `;
                    return;
                }

                // 2. PPTX
                if (ext === 'pptx' || ext === 'ppt') {
                    let finalPdfUrl = null;

                    // 1. Check in-memory cached PDF
                    if (targetFile?.pdfDataUrl && typeof targetFile.pdfDataUrl === 'string' && targetFile.pdfDataUrl.startsWith('data:application/pdf')) {
                        finalPdfUrl = targetFile.pdfDataUrl;
                    }

                    // 2. Check server for pre-converted PDF
                    if (!finalPdfUrl && targetFile?.topicId !== undefined && targetFile?.fileIndex !== undefined) {
                        try {
                            const token = localStorage.getItem('mentorae_token');
                            const srvPdfUrl = `/api/content/topics/${targetFile.topicId}/files/${targetFile.fileIndex}/download?asPdf=true`;
                            const srvRes = await fetch(srvPdfUrl, {
                                headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                            });
                            if (srvRes.ok) {
                                const srvBuf = await srvRes.arrayBuffer();
                                if (srvBuf && srvBuf.byteLength >= 4) {
                                    const header = String.fromCharCode(...new Uint8Array(srvBuf.slice(0, 4)));
                                    if (header.startsWith('%PDF')) {
                                        finalPdfUrl = URL.createObjectURL(new Blob([srvBuf], { type: 'application/pdf' }));
                                    }
                                }
                            }
                        } catch (e) {}
                    }

                    // 3. Client-side conversion
                    if (!finalPdfUrl && window.MentoraePptxToPdf && (arrayBuffer || dataUrl)) {
                        try {
                            const buf = arrayBuffer || dataUrl;
                            const convPdf = await window.MentoraePptxToPdf.convert(buf);
                            if (convPdf && convPdf.startsWith('data:application/pdf')) {
                                finalPdfUrl = convPdf;
                                if (targetFile) targetFile.pdfDataUrl = convPdf;
                            }
                        } catch (e) {
                            console.warn('PPTX conversion fallback:', e);
                        }
                    }

                    if (finalPdfUrl) {
                        stageEl.innerHTML = `
                            <object data="${finalPdfUrl}" type="application/pdf" class="w-100 h-100 border-0" style="background: #525659;">
                                <iframe src="${finalPdfUrl}" class="w-100 h-100 border-0" title="${fileName}" style="background: #525659;"></iframe>
                            </object>
                        `;
                        return;
                    }
                }

                // 3. Word Documents
                if ((ext === 'docx' || ext === 'doc') && arrayBuffer) {
                    stageEl.innerHTML = `
                        <div class="docx-viewer-wrapper">
                            <div id="docxPreviewHost" class="docx-preview-host"></div>
                        </div>
                    `;
                    const host = document.getElementById('docxPreviewHost');

                    function paginateDocxContainer(hostEl) {
                        if (!hostEl) return;
                        const sections = Array.from(hostEl.querySelectorAll('section.docx, .docx-wrapper > section, .docx-paper-sheet'));
                        if (!sections.length) return;

                        const TARGET_PAGE_HEIGHT = 1056; // Standard 8.5" x 11" Letter page height at 96 DPI
                        const PAGE_PADDING_V = 136; // Top (64px) + bottom (64px) padding + margin allowance
                        const USABLE_HEIGHT = TARGET_PAGE_HEIGHT - PAGE_PADDING_V; // ~920px

                        sections.forEach(sec => {
                            if (sec.classList.contains('docx-paginated-done')) return;

                            // If section is already within 1 page height, attach page badge
                            if (sec.offsetHeight <= TARGET_PAGE_HEIGHT + 60) {
                                if (!sec.querySelector('.docx-page-footer-badge')) {
                                    const footer = document.createElement('div');
                                    footer.className = 'docx-page-footer-badge';
                                    footer.innerHTML = '<span class="docx-page-num-badge">Page 1 of 1</span>';
                                    sec.appendChild(footer);
                                }
                                sec.classList.add('docx-paginated-done');
                                return;
                            }

                            const rawChildren = Array.from(sec.children).filter(c => 
                                c.tagName !== 'HEADER' && 
                                c.tagName !== 'FOOTER' && 
                                !c.classList.contains('docx-page-footer-badge')
                            );
                            if (rawChildren.length <= 1) return;

                            const pages = [];
                            let curPageChildren = [];
                            let accumulatedH = 0;

                            rawChildren.forEach(child => {
                                const h = child.offsetHeight || 30;
                                if (accumulatedH + h > USABLE_HEIGHT && curPageChildren.length > 0) {
                                    pages.push(curPageChildren);
                                    curPageChildren = [child];
                                    accumulatedH = h;
                                } else {
                                    curPageChildren.push(child);
                                    accumulatedH += h;
                                }
                            });
                            if (curPageChildren.length > 0) {
                                pages.push(curPageChildren);
                            }

                            if (pages.length <= 1) return;

                            const parent = sec.parentNode;
                            const totalPages = pages.length;

                            pages.forEach((pageChildren, pageIdx) => {
                                const pageSec = document.createElement('section');
                                pageSec.className = `${sec.className} docx-paginated-done`;
                                if (sec.style.cssText) pageSec.style.cssText = sec.style.cssText;
                                pageSec.style.minHeight = `${TARGET_PAGE_HEIGHT}px`;
                                pageSec.style.marginBottom = '32px';
                                pageSec.style.position = 'relative';

                                pageChildren.forEach(c => pageSec.appendChild(c));

                                const pageFooter = document.createElement('div');
                                pageFooter.className = 'docx-page-footer-badge';
                                pageFooter.innerHTML = `<span class="docx-page-num-badge">Page ${pageIdx + 1} of ${totalPages}</span>`;
                                pageSec.appendChild(pageFooter);

                                parent.insertBefore(pageSec, sec);
                            });

                            parent.removeChild(sec);
                        });
                    }

                    async function postProcessDocxMediaAndShapes(arrayBuf, hostEl) {
                        if (!arrayBuf || !hostEl || !window.JSZip) return;
                        try {
                            const zip = await window.JSZip.loadAsync(arrayBuf);
                            const allFiles = Object.keys(zip.files);
                            const allMediaFiles = allFiles.filter(f => /^word\/media\/.+\.(png|jpe?g|gif|webp|svg)$/i.test(f));
                            const renderedImgs = Array.from(hostEl.querySelectorAll('img'));

                            // Detect native Word vector shapes/SmartArt
                            let hasShapesOrSmartArt = false;
                            if (allFiles.some(f => /^word\/diagrams\//i.test(f))) {
                                hasShapesOrSmartArt = true;
                            }
                            const docXml = await zip.file('word/document.xml')?.async('string');
                            if (docXml && (docXml.includes('wps:wsp') || docXml.includes('wpg:wgp') || docXml.includes('v:shape') || docXml.includes('wpc:wpc') || docXml.includes('dgm:'))) {
                                hasShapesOrSmartArt = true;
                            }

                            // Only restore media if docx-preview missed embedded images (e.g. inside shapes/SmartArt)
                            const needsMediaRestoration = allMediaFiles.length > 0 && renderedImgs.length < allMediaFiles.length;

                            if (needsMediaRestoration) {
                                const renderedSrcs = renderedImgs.map(img => img.src || '');
                                const restoredMediaFiles = new Set();

                                const isFileAlreadyRendered = async (fileObj) => {
                                    if (!fileObj) return true;
                                    if (renderedImgs.length === 0) return false;
                                    try {
                                        const b64 = await fileObj.async('base64');
                                        const sig = b64.slice(0, 48);
                                        return renderedSrcs.some(src => src.includes(sig));
                                    } catch (e) {
                                        return false;
                                    }
                                };

                                // 1. Parse document relationships to map rId -> target media
                                const relsStr = await zip.file('word/_rels/document.xml.rels')?.async('string');
                                const relMap = {};
                                if (relsStr) {
                                    const relRegex = /<Relationship[^>]+Id="([^"]+)"[^>]+Target="([^"]+)"/gi;
                                    let rm;
                                    while ((rm = relRegex.exec(relsStr)) !== null) {
                                        relMap[rm[1]] = rm[2].replace(/^\/?word\//i, '').replace(/^media\//i, 'media/');
                                    }
                                }

                                // 2. Parse document.xml to find exact placement and preceding text for each image
                                const imagePlacements = [];
                                if (docXml) {
                                    const pRegex = /<w:p(?: [^>]*)?>([\s\S]*?)<\/w:p>/gi;
                                    let pm;
                                    let pIdx = 0;
                                    let lastText = '';

                                    while ((pm = pRegex.exec(docXml)) !== null) {
                                        const pContent = pm[1];
                                        const tMatches = [...pContent.matchAll(/<w:t(?: [^>]*)?>([^<]*)<\/w:t>/gi)];
                                        const text = tMatches.map(m => m[1]).join('').trim();
                                        if (text) {
                                            lastText = text;
                                        }

                                        const idMatches = [...pContent.matchAll(/(?:embed|id)="([^"]+)"/gi)];
                                        for (const im of idMatches) {
                                            const rId = im[1];
                                            const target = relMap[rId];
                                            if (target && /^media\//i.test(target)) {
                                                imagePlacements.push({
                                                    rId,
                                                    mediaPath: 'word/' + target,
                                                    fileName: target.split('/').pop(),
                                                    pIndex: pIdx,
                                                    precedingText: lastText
                                                });
                                            }
                                        }
                                        pIdx++;
                                    }
                                }

                                // 3. Extract and place missing images in the EXACT DOM location
                                const section = hostEl.querySelector('section.docx, .docx-paper-sheet') || hostEl;
                                const emptyDrawingContainers = Array.from(
                                    hostEl.querySelectorAll('div[style*="inline-block"], div[style*="position: relative"], div[style*="width: 0px"], div[style*="height: 0px"]')
                                ).filter(el => !el.querySelector('img') && !el.querySelector('svg') && !el.querySelector('table') && !el.innerText.trim());

                                const domParas = Array.from(section.querySelectorAll('p, h1, h2, h3, h4, h5, h6'));

                                for (let i = 0; i < imagePlacements.length; i++) {
                                    const placement = imagePlacements[i];
                                    if (restoredMediaFiles.has(placement.fileName)) continue;

                                    const file = zip.file(placement.mediaPath) || zip.file(new RegExp(placement.fileName + '$', 'i'))[0];
                                    if (!file) continue;

                                    // Skip if already rendered natively by docx-preview
                                    if (await isFileAlreadyRendered(file)) {
                                        restoredMediaFiles.add(placement.fileName);
                                        continue;
                                    }

                                    const blob = await file.async('blob');
                                    const blobUrl = URL.createObjectURL(blob);

                                    const imgEl = document.createElement('img');
                                    imgEl.src = blobUrl;
                                    imgEl.alt = placement.fileName || 'Document Diagram';
                                    imgEl.className = 'docx-restored-img img-fluid';
                                    imgEl.style.maxWidth = '100%';
                                    imgEl.style.height = 'auto';
                                    imgEl.style.display = 'block';
                                    imgEl.style.margin = '16px auto';
                                    imgEl.style.objectFit = 'contain';

                                    let placed = false;

                                    // Strategy A: If docx-preview created an empty drawing container at this spot
                                    if (emptyDrawingContainers.length > 0) {
                                        const emptyBox = emptyDrawingContainers.shift();
                                        emptyBox.style.width = 'auto';
                                        emptyBox.style.height = 'auto';
                                        emptyBox.style.minHeight = '60px';
                                        emptyBox.style.display = 'block';
                                        emptyBox.style.position = 'relative';
                                        emptyBox.style.textAlign = 'center';
                                        emptyBox.style.margin = '16px auto';
                                        emptyBox.appendChild(imgEl);
                                        placed = true;
                                    }

                                    // Strategy B: Match by preceding paragraph text (e.g. "Diagram")
                                    if (!placed && placement.precedingText) {
                                        const matchedEl = domParas.find(el => {
                                            const txt = el.innerText.trim();
                                            return txt && (txt === placement.precedingText || txt.includes(placement.precedingText) || placement.precedingText.includes(txt));
                                        });
                                        if (matchedEl && matchedEl.parentNode) {
                                            const pWrapper = document.createElement('div');
                                            pWrapper.className = 'docx-img-placement text-center my-3';
                                            pWrapper.appendChild(imgEl);
                                            matchedEl.parentNode.insertBefore(pWrapper, matchedEl.nextSibling);
                                            placed = true;
                                        }
                                    }

                                    // Strategy C: Match by paragraph index
                                    if (!placed && domParas[placement.pIndex]) {
                                        const targetPara = domParas[placement.pIndex];
                                        if (targetPara && targetPara.parentNode) {
                                            const pWrapper = document.createElement('div');
                                            pWrapper.className = 'docx-img-placement text-center my-3';
                                            pWrapper.appendChild(imgEl);
                                            targetPara.parentNode.insertBefore(pWrapper, targetPara);
                                            placed = true;
                                        }
                                    }

                                    // Strategy D: Fallback to section
                                    if (!placed) {
                                        const pWrapper = document.createElement('div');
                                        pWrapper.className = 'docx-img-placement text-center my-3';
                                        pWrapper.appendChild(imgEl);
                                        section.appendChild(pWrapper);
                                    }

                                    restoredMediaFiles.add(placement.fileName);
                                    renderedSrcs.push(blobUrl);
                                }

                                // Also check any unmapped media in word/media/
                                for (const mf of allMediaFiles) {
                                    const fileName = mf.split('/').pop();
                                    if (restoredMediaFiles.has(fileName)) continue;

                                    const file = zip.file(mf);
                                    if (!file) continue;
                                    if (await isFileAlreadyRendered(file)) {
                                        restoredMediaFiles.add(fileName);
                                        continue;
                                    }

                                    try {
                                        const b = await file.async('blob');
                                        const u = URL.createObjectURL(b);
                                        const fallbackImg = document.createElement('img');
                                        fallbackImg.src = u;
                                        fallbackImg.alt = fileName;
                                        fallbackImg.className = 'docx-restored-img img-fluid d-block mx-auto my-3';
                                        fallbackImg.style.maxWidth = '100%';
                                        fallbackImg.style.height = 'auto';
                                        fallbackImg.style.objectFit = 'contain';

                                        if (emptyDrawingContainers.length > 0) {
                                            const box = emptyDrawingContainers.shift();
                                            box.style.width = 'auto';
                                            box.style.height = 'auto';
                                            box.appendChild(fallbackImg);
                                        } else {
                                            section.appendChild(fallbackImg);
                                        }
                                        restoredMediaFiles.add(fileName);
                                        renderedSrcs.push(u);
                                    } catch (e) {}
                                }
                            }

                            // Wait for all images to decode so paginateDocxContainer knows true pixel heights
                            const allImgs = Array.from(hostEl.querySelectorAll('img'));
                            await Promise.all(allImgs.map(img => img.decode ? img.decode().catch(() => {}) : Promise.resolve()));

                            // Native Word vector shapes banner if applicable
                            if (hasShapesOrSmartArt) {
                                const firstSec = hostEl.querySelector('section.docx, .docx-paper-sheet') || hostEl;
                                if (!firstSec.querySelector('.docx-shape-notice')) {
                                    const notice = document.createElement('div');
                                    notice.className = 'docx-shape-notice alert alert-info py-2 px-3 mb-3 border-0 rounded-3 d-flex align-items-center justify-content-between gap-2 shadow-sm';
                                    notice.style.fontSize = '0.8rem';
                                    notice.innerHTML = `
                                        <div class="d-flex align-items-center gap-2">
                                            <i class="bi bi-info-circle-fill text-info fs-6"></i>
                                            <span>This document contains native Word vector shapes/diagrams. Download or open in Office 365 to view full vector graphics.</span>
                                        </div>
                                    `;
                                    firstSec.insertBefore(notice, firstSec.firstChild);
                                }
                            }
                        } catch (zipErr) {
                            console.warn('Exact docx media placement notice:', zipErr);
                        }
                    }

                    if (modeSwitcherEl) {
                        modeSwitcherEl.innerHTML = `
                            <button type="button" class="btn btn-sm btn-dark text-white rounded-pill px-2.5 py-0.5 border-0" id="docxZoomOutBtn" title="Zoom out">
                                <i class="bi bi-zoom-out"></i>
                            </button>
                            <span class="micro-text text-white-50 px-1 fw-semibold" id="docxZoomVal">100%</span>
                            <button type="button" class="btn btn-sm btn-dark text-white rounded-pill px-2.5 py-0.5 border-0" id="docxZoomInBtn" title="Zoom in">
                                <i class="bi bi-zoom-in"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-light rounded-pill px-2.5 py-0.5 ms-1 border-opacity-50" id="docxFitBtn" title="Reset zoom">
                                Fit
                            </button>
                        `;
                        let currentZoom = 1.0;
                        const updateZoom = (z) => {
                            currentZoom = Math.min(Math.max(0.5, Math.round(z * 100) / 100), 2.0);
                            const zoomValEl = document.getElementById('docxZoomVal');
                            if (zoomValEl) zoomValEl.textContent = `${Math.round(currentZoom * 100)}%`;
                            if (host) {
                                host.style.transform = `scale(${currentZoom})`;
                                host.style.transformOrigin = 'top center';
                            }
                        };
                        document.getElementById('docxZoomOutBtn')?.addEventListener('click', () => updateZoom(currentZoom - 0.15));
                        document.getElementById('docxZoomInBtn')?.addEventListener('click', () => updateZoom(currentZoom + 0.15));
                        document.getElementById('docxFitBtn')?.addEventListener('click', () => updateZoom(1.0));
                    }

                    if (ext === 'docx' && window.docx && typeof window.docx.renderAsync === 'function') {
                        try {
                            await window.docx.renderAsync(arrayBuffer, host, null, {
                                className: 'docx',
                                inWrapper: true,
                                ignoreWidth: false,
                                ignoreHeight: false,
                                ignoreFonts: false,
                                breakPages: true,
                                ignoreLastRenderedPageBreak: false,
                                useBase64URL: true,
                                renderHeaders: true,
                                renderFooters: true,
                                renderFootnotes: true,
                                renderEndnotes: true
                            });
                            await postProcessDocxMediaAndShapes(arrayBuffer, host);
                            paginateDocxContainer(host);
                            setTimeout(() => paginateDocxContainer(host), 60);
                            return;
                        } catch (e) {
                            console.warn('docx-preview error in file_viewer_teacher:', e);
                        }
                    }

                    if (window.mammoth) {
                        try {
                            const res = await window.mammoth.convertToHtml({ arrayBuffer });
                            host.innerHTML = `<div class="docx-paper-sheet">${res.value}</div>`;
                            await postProcessDocxMediaAndShapes(arrayBuffer, host);
                            paginateDocxContainer(host);
                            setTimeout(() => paginateDocxContainer(host), 60);
                            return;
                        } catch (e) {
                            console.warn('mammoth error in file_viewer_teacher:', e);
                        }
                    }
                }

                // 4. Spreadsheets
                if ((ext === 'xlsx' || ext === 'xls' || ext === 'csv') && arrayBuffer && window.XLSX) {
                    try {
                        const wb = window.XLSX.read(arrayBuffer, { type: 'array' });
                        const sheetNames = wb.SheetNames || [];
                        if (sheetNames.length > 0) {
                            function renderSheet(idx) {
                                const sName = sheetNames[idx];
                                const ws = wb.Sheets[sName];
                                const html = window.XLSX.utils.sheet_to_html(ws, { editable: false });
                                stageEl.innerHTML = `
                                    <div class="spreadsheet-viewer-wrapper">
                                        <div class="spreadsheet-tabs-bar">
                                            <span class="fw-bold text-dark small me-2"><i class="bi bi-file-earmark-spreadsheet text-success me-1"></i>Sheets:</span>
                                            ${sheetNames.map((name, i) => `
                                                <button type="button" class="btn btn-sm ${i === idx ? 'btn-success text-white fw-bold' : 'btn-outline-secondary'} rounded-pill px-3 py-1 small sheet-tab-btn" data-sidx="${i}">
                                                    ${name}
                                                </button>
                                            `).join('')}
                                        </div>
                                        <div class="spreadsheet-content-stage">${html}</div>
                                    </div>
                                `;
                                stageEl.querySelectorAll('.sheet-tab-btn').forEach(b => {
                                    b.addEventListener('click', () => renderSheet(parseInt(b.dataset.sidx, 10)));
                                });
                            }
                            renderSheet(0);
                            return;
                        }
                    } catch (e) { }
                }

                // 5. Images
                if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg'].includes(ext) || mime.startsWith('image/')) {
                    stageEl.innerHTML = `
                        <div class="d-flex align-items-center justify-content-center w-100 h-100 p-4" style="background-color: #0b0c0e;">
                            <img src="${activeUrl}" alt="${fileName}" class="img-fluid rounded shadow-lg" style="max-height: 90vh; max-width: 95vw; object-fit: contain;">
                        </div>
                    `;
                    return;
                }

                // 6. Video
                if (['mp4', 'webm', 'ogg'].includes(ext) || mime.startsWith('video/')) {
                    stageEl.innerHTML = `
                        <div class="media-viewer-stage">
                            <video controls autoplay class="rounded shadow-lg" src="${activeUrl}">
                                <source src="${activeUrl}" type="${mime || 'video/mp4'}">
                            </video>
                        </div>
                    `;
                    return;
                }

                // 7. Audio
                if (['mp3', 'wav', 'ogg', 'm4a'].includes(ext) || mime.startsWith('audio/')) {
                    stageEl.innerHTML = `
                        <div class="d-flex align-items-center justify-content-center w-100 h-100 text-white p-4">
                            <div class="audio-viewer-card">
                                <i class="bi bi-music-note-beamed text-primary fs-1 mb-3 d-block"></i>
                                <h5 class="fw-bold text-white mb-2">${fileName}</h5>
                                <audio controls autoplay class="w-100 mt-3" src="${activeUrl}">
                                    <source src="${activeUrl}" type="${mime || 'audio/mpeg'}">
                                </audio>
                            </div>
                        </div>
                    `;
                    return;
                }

                // 8. Text
                if (['txt', 'json', 'log', 'md', 'html', 'js', 'css', 'xml'].includes(ext) || mime.startsWith('text/')) {
                    let text = '';
                    try {
                        if (blob) text = await blob.text();
                        else if (dataUrl && dataUrl.startsWith('data:')) text = atob(dataUrl.split(',')[1]);
                    } catch (e) { }
                    stageEl.innerHTML = `
                        <div class="docx-paper-container">
                            <div class="docx-page-card font-monospace" style="white-space: pre-wrap; font-size: 0.95rem; color: #1e293b;">
                                ${text || 'Empty file.'}
                            </div>
                        </div>
                    `;
                    return;
                }

                // Fallback
                stageEl.innerHTML = `
                    <div class="p-5 text-center text-white mx-auto my-auto" style="max-width: 500px;">
                        <i class="bi bi-file-earmark-arrow-down text-info" style="font-size: 5rem;"></i>
                        <h4 class="fw-bold text-white mt-3">${fileName}</h4>
                        <p class="text-white-50 mb-4">Click download below to save and open this file on your device.</p>
                        <a href="${activeUrl}" download="${fileName}" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold">
                            <i class="bi bi-download me-2"></i> Download File
                        </a>
                    </div>
                `;
            }

            function openOnlineDocViewer(fileName, dataUrl) {
                openClassroomViewer(fileName, dataUrl);
            }

            function renderFileList() {
                const fileList = document.getElementById('fileList');
                fileList.innerHTML = '';
                if (currentTopic && currentTopic.files && currentTopic.files.length > 0) {
                    currentTopic.files.forEach((file, index) => {
                        let fileUrl = '#';
                        try {
                            const blob = dataURItoBlob(file.dataUrl, file.name || '');
                            fileUrl = blob ? URL.createObjectURL(blob) : file.dataUrl;
                        } catch (e) {
                            console.error(`Failed to create Blob URL for ${file.name}:`, e);
                        }

                        const li = document.createElement('li');
                        li.className = 'list-group-item d-flex justify-content-between align-items-center py-2.5 px-3';
                        li.innerHTML = `
                            <div class="d-flex align-items-center gap-2 text-truncate me-2">
                                <i class="bi bi-file-earmark-text-fill text-primary fs-5"></i>
                                <div>
                                    <span class="fw-semibold text-dark d-block text-truncate small">${file.name || 'Attached File'}</span>
                                    ${file.size ? `<span class="micro-text text-muted">${(file.size / 1024).toFixed(1)} KB</span>` : ''}
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <button type="button" class="btn btn-sm btn-primary fw-semibold rounded-pill px-3 py-1 text-nowrap btn-open-online-viewer" data-index="${index}">
                                    <i class="bi bi-eye me-1"></i> Read Online
                                </button>
                                <a href="${fileUrl}" download="${file.name || 'download'}" class="btn btn-sm btn-outline-success fw-semibold rounded-pill px-3 py-1 text-nowrap">
                                    <i class="bi bi-download me-1"></i> Download
                                </a>
                                <button type="button" class="btn btn-sm btn-outline-danger delete-file-btn rounded-pill px-2 py-1" data-index="${index}" title="Delete File"><i class="bi bi-trash"></i></button>
                            </div>
                        `;
                        fileList.appendChild(li);
                    });

                    fileList.querySelectorAll('.btn-open-online-viewer').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const idx = parseInt(btn.dataset.index, 10);
                            const targetFile = currentTopic.files[idx];
                            if (targetFile) {
                                openOnlineDocViewer(targetFile.name, targetFile.dataUrl);
                            }
                        });
                    });
                } else {
                    fileList.innerHTML = '<li class="list-group-item text-muted text-center py-3">No files have been uploaded for this topic yet.</li>';
                }
            }

            function handleFileUpload(files) {
                if (!currentTopic) return;
                if (!currentTopic.files) currentTopic.files = [];

                const filePromises = [];

                for (let file of files) {
                    const promise = (async () => {
                        const ext = (file.name || '').split('.').pop().toLowerCase();
                        const allowedExts = ['pdf', 'doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx', 'txt', 'csv', 'png', 'jpg', 'jpeg', 'webp'];
                        if (!allowedExts.includes(ext) || ['exe', 'bat', 'cmd', 'sh', 'bin', 'msi', 'com', 'vbs', 'ps1'].includes(ext)) {
                            alert(`Unsupported file type for "${file.name}". Please upload a PDF, Office document, text file, or image.`);
                            return null;
                        }

                        if (window.MentoraePresentationOptimizer && window.MentoraePresentationOptimizer.isOptimizable(file)) {
                            try {
                                const optResult = await window.MentoraePresentationOptimizer.optimizeOfficeFile(file);
                                if (optResult && optResult.wasOptimized && optResult.file) {
                                    file = optResult.file;
                                }
                            } catch (optErr) {
                                console.warn('[Optimizer] Presentation optimizer error:', optErr);
                            }
                        }

                        if (file.size > 25 * 1024 * 1024) {
                            alert(`File "${file.name}" is too large (max 25MB) and will not be saved.`);
                            return null;
                        }

                        return new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = (event) => {
                                resolve({
                                    name: file.name,
                                    size: file.size,
                                    dataUrl: event.target.result
                                });
                            };
                            reader.onerror = (error) => {
                                console.error("File reading error:", error);
                                reject(error);
                            };
                            reader.readAsDataURL(file);
                        });
                    })();
                    filePromises.push(promise);
                }

                Promise.all(filePromises).then(fileDataArray => {
                    const validFiles = fileDataArray.filter(f => f !== null);
                    if (validFiles.length > 0) {
                        currentTopic.files.push(...validFiles);
                        saveData();
                        renderFileList();
                        alert(`${validFiles.length} file(s) added successfully!`);
                    }
                }).catch(error => {
                    console.error("Error processing files:", error);
                    alert("An error occurred while reading the files.");
                });
            }

            // Event Listeners
            const browseFilesBtn = document.getElementById('browseFilesBtn');
            const fileUploadInput = document.getElementById('fileUploadInput');
            browseFilesBtn.addEventListener('click', () => fileUploadInput.click());
            fileUploadInput.addEventListener('change', (e) => handleFileUpload(e.target.files));

            document.getElementById('fileList').addEventListener('click', (e) => {
                const deleteBtn = e.target.closest('.delete-file-btn');
                if (deleteBtn) {
                    const index = deleteBtn.dataset.index;
                    if (confirm(`Are you sure you want to delete this file?`)) {
                        currentTopic.files.splice(index, 1);
                        saveData();
                        renderFileList();
                    }
                }
            });

            // Live date and time
            function updateDateTime() {
                const liveDateElement = document.getElementById('liveDate');
                const liveTimeElement = document.getElementById('liveTime');
                if (!liveDateElement || !liveTimeElement) return;

                const now = new Date();
                const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                liveDateElement.textContent = now.toLocaleDateString('en-US', dateOptions);
                const timeOptions = { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true };
                liveTimeElement.textContent = now.toLocaleTimeString('en-US', timeOptions);
            }
            updateDateTime();
            setInterval(updateDateTime, 1000);

            // Initial Load
            loadData();
        });
