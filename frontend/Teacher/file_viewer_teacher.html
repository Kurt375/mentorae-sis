<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - File Viewer</title>
    <!-- Bootstrap 5.3.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="subject_detail_teacher.css">
</head>

<body class="dashboard-bg">

    <!-- Bounded Page Wrapper -->
    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">

        <!-- Header Ribbon Navbar -->
        <nav class="navbar navbar-dark custom-navbar py-3 border-bottom">
            <div class="container-fluid px-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-3">
                    <a href="#" class="text-white text-decoration-none fs-4 link-transition" id="backBtn"
                        aria-label="Go Back">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                    <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                        <img src="../TSHS_image.png" alt="School Logo" class="school-logo-img">
                    </div>
                    <div>
                        <h1 class="navbar-brand m-0 fs-4 fw-bold tracking-wide d-inline-block" id="pageTitle">File
                            Viewer</h1>
                        <p class="m-0 micro-text text-white-50 opacity-75 d-none d-sm-block" id="pageSubtitle">Topic:
                            Loading...</p>
                    </div>
                </div>
                <div class="text-white text-end dashboard-time">
                    <div class="small opacity-75" id="liveDate"></div>
                    <div class="fs-4 fw-bold m-0" id="liveTime"></div>
                </div>
            </div>
        </nav>

        <!-- Main Content Workspace Fill -->
        <main class="container-fluid px-4 py-4 flex-grow-1 workspace-content-fill">
            <div class="card border-0 shadow-sm p-4">
                <h2 class="h5 fw-bold text-dark mb-3" id="fileTopicTitle">Files for...</h2>

                <!-- File Upload Section -->
                <div class="card bg-light border-dashed p-4 mb-4 text-center" id="dropZone">
                    <i class="bi bi-upload fs-1 text-secondary"></i>
                    <p class="mt-2 text-muted">Drag & drop files here or click to browse</p>
                    <input type="file" id="fileUploadInput" class="d-none" multiple>
                    <button class="btn btn-success" id="browseFilesBtn"><i class="bi bi-folder2-open me-2"></i>Browse
                        Files</button>
                </div>

                <!-- Uploaded Files List -->
                <h3 class="h6 fw-bold text-dark mb-3">Uploaded Files</h3>
                <ul class="list-group" id="fileList">
                    <!-- Files will be dynamically inserted here -->
                </ul>
            </div>
        </main>
    </div>

    <!-- Online Document / Lesson Viewer Modal -->
    <div class="modal fade" id="onlineDocViewerModal" tabindex="-1" aria-labelledby="onlineDocViewerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable" style="max-width: 92vw;">
            <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
                <div class="modal-header bg-dark text-white py-2.5 px-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2 text-truncate me-3">
                        <i class="bi bi-file-earmark-richtext fs-5 text-warning"></i>
                        <h5 class="modal-title fw-bold fs-6 m-0 text-truncate text-white" id="onlineDocViewerModalLabel">Document Viewer</h5>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <a href="#" id="docViewerDownloadBtn" download class="btn btn-sm btn-outline-light rounded-pill px-3 py-1 fw-semibold text-nowrap">
                            <i class="bi bi-download me-1"></i> Download
                        </a>
                        <a href="#" id="docViewerPopoutBtn" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-light rounded-pill px-3 py-1 fw-semibold text-nowrap">
                            <i class="bi bi-box-arrow-up-right me-1"></i> New Tab
                        </a>
                        <button type="button" class="btn-close btn-close-white ms-2" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                </div>
                <div class="modal-body p-0 bg-secondary bg-opacity-10 d-flex flex-column align-items-center justify-content-center" id="docViewerBody" style="min-height: 78vh; max-height: 82vh; overflow-y: auto;">
                    <!-- Dynamically rendered content (iframe, img, text) -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const SUBJECTS_STORAGE_KEY = 'mentorae-subjects-data';
            const urlParams = new URLSearchParams(window.location.search);
            const subjectName = urlParams.get('subject');
            const topicName = urlParams.get('topic');

            const decodedSubject = subjectName ? decodeURIComponent(subjectName) : 'Subject';
            const decodedTopic = topicName ? decodeURIComponent(topicName) : 'Topic';

            // Update titles and back button
            document.title = `Mentorae - Files: ${decodedTopic}`;
            const pageSubtitle = document.getElementById('pageSubtitle');
            if (pageSubtitle) pageSubtitle.textContent = `Topic: ${decodedTopic}`;

            const fileTopicTitle = document.getElementById('fileTopicTitle');
            if (fileTopicTitle) fileTopicTitle.textContent = `Files for ${decodedTopic}`;

            const backBtn = document.getElementById('backBtn');
            if (backBtn) {
                backBtn.href = `subject_detail_teacher.html?subject=${encodeURIComponent(subjectName || '')}`;
            }

            let allSubjects = [];
            let currentSubject = null;
            let currentTopic = null;

            async function loadData() {
                const storedSubjects = localStorage.getItem(SUBJECTS_STORAGE_KEY);
                allSubjects = storedSubjects ? JSON.parse(storedSubjects) : [];
                currentSubject = allSubjects.find(s => s.name === decodedSubject);
                if (currentSubject) {
                    if (!currentSubject.topics) {
                        currentSubject.topics = [];
                    }
                    const allContent = [...(currentSubject.topics || []), ...(currentSubject.recommendations || [])];
                    currentTopic = allContent.find(t => t.title === decodedTopic);
                    if (currentTopic && !currentTopic.files) {
                        currentTopic.files = [];
                    }
                }

                if (!currentTopic && decodedSubject) {
                    try {
                        const token = localStorage.getItem('mentorae_token');
                        if (token) {
                            const data = await authedFetch(`/api/content/topics?subjectName=${encodeURIComponent(decodedSubject)}`, token);
                            if (data && data.success) {
                                const allContent = [...(data.topics || []), ...(data.recommendations || [])];
                                currentTopic = allContent.find(t => t.title === decodedTopic);
                                if (currentTopic && !currentTopic.files) currentTopic.files = [];
                            }
                        }
                    } catch (e) {
                        console.error('Failed to load topic files from DB:', e);
                    }
                }

                renderFileList();
            }

            function saveData() {
                const subjectIndex = allSubjects.findIndex(s => s.name === decodedSubject);
                if (subjectIndex !== -1) {
                    allSubjects[subjectIndex] = currentSubject;
                    localStorage.setItem(SUBJECTS_STORAGE_KEY, JSON.stringify(allSubjects));
                }
            }

            function getMimeTypeFromFilename(filename, fallbackMime) {
                if (!filename) return fallbackMime || 'application/octet-stream';
                const ext = filename.split('.').pop().toLowerCase();
                const mimeMap = {
                    'pdf': 'application/pdf',
                    'png': 'image/png',
                    'jpg': 'image/jpeg',
                    'jpeg': 'image/jpeg',
                    'gif': 'image/gif',
                    'webp': 'image/webp',
                    'svg': 'image/svg+xml',
                    'txt': 'text/plain',
                    'md': 'text/plain',
                    'html': 'text/html',
                    'htm': 'text/html',
                    'json': 'application/json',
                    'csv': 'text/plain',
                    'mp4': 'video/mp4',
                    'webm': 'video/webm',
                    'mp3': 'audio/mpeg',
                    'wav': 'audio/wav',
                    'docx': 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
                    'doc': 'application/msword',
                    'pptx': 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
                    'ppt': 'application/vnd.ms-powerpoint',
                    'xlsx': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                    'xls': 'application/vnd.ms-excel'
                };
                return mimeMap[ext] || fallbackMime || 'application/octet-stream';
            }

            function dataURItoBlob(dataURI, filename = '') {
                if (!dataURI || !dataURI.includes(',')) return null;
                try {
                    var parts = dataURI.split(',');
                    var byteString = atob(parts[1]);
                    var mimeString = parts[0].split(':')[1]?.split(';')[0];
                    if (!mimeString || mimeString === 'application/octet-stream') {
                        mimeString = getMimeTypeFromFilename(filename, mimeString);
                    }
                    var ab = new ArrayBuffer(byteString.length);
                    var ia = new Uint8Array(ab);
                    for (var i = 0; i < byteString.length; i++) {
                        ia[i] = byteString.charCodeAt(i);
                    }
                    return new Blob([ab], { type: mimeString });
                } catch (e) {
                    console.error('Error converting data URI to blob:', e);
                    return null;
                }
            }

            function openOnlineDocViewer(fileName, dataUrl) {
                const titleEl = document.getElementById('onlineDocViewerModalLabel');
                const bodyEl = document.getElementById('docViewerBody');
                const downloadBtn = document.getElementById('docViewerDownloadBtn');
                const popoutBtn = document.getElementById('docViewerPopoutBtn');

                if (titleEl) titleEl.textContent = fileName || 'Document Viewer';

                let blob = null;
                let blobUrl = dataUrl;
                let mime = getMimeTypeFromFilename(fileName, '');

                if (dataUrl && dataUrl.startsWith('data:')) {
                    blob = dataURItoBlob(dataUrl, fileName);
                    if (blob) {
                        blobUrl = URL.createObjectURL(blob);
                        if (blob.type) mime = blob.type;
                    }
                }

                if (downloadBtn) {
                    downloadBtn.href = blobUrl || '#';
                    downloadBtn.setAttribute('download', fileName || 'document');
                }
                if (popoutBtn) {
                    popoutBtn.href = blobUrl || '#';
                }

                if (bodyEl) {
                    bodyEl.innerHTML = '';
                    const ext = (fileName || '').split('.').pop().toLowerCase();

                    if (mime.includes('pdf') || ext === 'pdf') {
                        const iframe = document.createElement('iframe');
                        iframe.src = blobUrl;
                        iframe.className = 'w-100 border-0 rounded-bottom-4';
                        iframe.style.height = '78vh';
                        iframe.setAttribute('title', fileName);
                        bodyEl.appendChild(iframe);
                    } else if (mime.startsWith('image/') || ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) {
                        const imgWrap = document.createElement('div');
                        imgWrap.className = 'd-flex align-items-center justify-content-center p-3 w-100 h-100';
                        imgWrap.innerHTML = `<img src="${blobUrl}" alt="${fileName}" class="img-fluid rounded shadow-sm" style="max-height: 75vh; object-fit: contain;">`;
                        bodyEl.appendChild(imgWrap);
                    } else if (mime.startsWith('video/') || ['mp4', 'webm', 'ogg'].includes(ext)) {
                        const videoWrap = document.createElement('div');
                        videoWrap.className = 'd-flex align-items-center justify-content-center p-3 w-100 h-100';
                        videoWrap.innerHTML = `<video controls autoplay class="rounded shadow-sm" style="max-width: 100%; max-height: 75vh;"><source src="${blobUrl}" type="${mime}">Your browser does not support video.</video>`;
                        bodyEl.appendChild(videoWrap);
                    } else if (mime.startsWith('audio/') || ['mp3', 'wav', 'ogg'].includes(ext)) {
                        const audioWrap = document.createElement('div');
                        audioWrap.className = 'text-center p-5';
                        audioWrap.innerHTML = `
                            <i class="bi bi-file-earmark-music text-primary fs-1 mb-3 d-block"></i>
                            <h5 class="fw-bold mb-3">${fileName}</h5>
                            <audio controls class="w-100" style="max-width: 400px;"><source src="${blobUrl}" type="${mime}">Your browser does not support audio.</audio>
                        `;
                        bodyEl.appendChild(audioWrap);
                    } else if (mime.startsWith('text/') || ['txt', 'md', 'json', 'csv', 'js', 'html', 'css'].includes(ext)) {
                        let textContent = '';
                        try {
                            if (dataUrl && dataUrl.startsWith('data:')) {
                                textContent = atob(dataUrl.split(',')[1]);
                            }
                        } catch (e) {
                            textContent = 'Unable to decode text preview.';
                        }
                        const textWrap = document.createElement('div');
                        textWrap.className = 'p-4 w-100 h-100 bg-white';
                        textWrap.innerHTML = `<pre class="font-monospace text-dark mb-0" style="white-space: pre-wrap; font-size: 0.9rem; max-height: 75vh; overflow-y: auto;">${textContent}</pre>`;
                        bodyEl.appendChild(textWrap);
                    } else {
                        const docIcon = (ext === 'docx' || ext === 'doc') ? 'bi-file-earmark-word text-primary' :
                                        (ext === 'pptx' || ext === 'ppt') ? 'bi-file-earmark-ppt text-danger' :
                                        (ext === 'xlsx' || ext === 'xls') ? 'bi-file-earmark-excel text-success' : 'bi-file-earmark-text text-secondary';
                        const fileTypeLabel = (ext === 'docx' || ext === 'doc') ? 'Microsoft Word Document' :
                                              (ext === 'pptx' || ext === 'ppt') ? 'Microsoft PowerPoint Presentation' :
                                              (ext === 'xlsx' || ext === 'xls') ? 'Microsoft Excel Spreadsheet' : 'Learning Material File';

                        const officeWrap = document.createElement('div');
                        officeWrap.className = 'text-center p-5 bg-white rounded-3 shadow-sm mx-auto my-auto';
                        officeWrap.style.maxWidth = '550px';
                        officeWrap.innerHTML = `
                            <i class="bi ${docIcon}" style="font-size: 4.5rem;"></i>
                            <h5 class="fw-bold text-dark mt-3 mb-1">${fileName}</h5>
                            <p class="text-muted small mb-3">${fileTypeLabel}</p>
                            <div class="alert alert-info py-2 px-3 small text-start mb-4">
                                <i class="bi bi-info-circle me-1"></i> Web browsers require Office files to be opened with Microsoft Office or Google Docs. You can download and open it instantly.
                            </div>
                            <div class="d-flex justify-content-center gap-2">
                                <a href="${blobUrl}" download="${fileName || 'lesson'}" class="btn btn-primary fw-semibold rounded-pill px-4 py-2">
                                    <i class="bi bi-download me-1"></i> Download File
                                </a>
                                <a href="${blobUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-outline-secondary fw-semibold rounded-pill px-3 py-2">
                                    <i class="bi bi-box-arrow-up-right me-1"></i> Open Tab
                                </a>
                            </div>
                        `;
                        bodyEl.appendChild(officeWrap);
                    }
                }

                const modalEl = document.getElementById('onlineDocViewerModal');
                if (modalEl && typeof bootstrap !== 'undefined') {
                    const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                    modal.show();
                }
            }

            function renderFileList() {
                const fileList = document.getElementById('fileList');
                fileList.innerHTML = '';
                if (currentTopic && currentTopic.files && currentTopic.files.length > 0) {
                    currentTopic.files.forEach((file, index) => {
                        let fileUrl = '#';
                        try {
                            const blob = dataURItoBlob(file.dataUrl, file.name || '');
                            fileUrl = blob ? URL.createObjectURL(blob) : file.dataUrl;
                        } catch (e) {
                            console.error(`Failed to create Blob URL for ${file.name}:`, e);
                        }

                        const li = document.createElement('li');
                        li.className = 'list-group-item d-flex justify-content-between align-items-center py-2.5 px-3';
                        li.innerHTML = `
                            <div class="d-flex align-items-center gap-2 text-truncate me-2">
                                <i class="bi bi-file-earmark-text-fill text-primary fs-5"></i>
                                <div>
                                    <span class="fw-semibold text-dark d-block text-truncate small">${file.name || 'Attached File'}</span>
                                    ${file.size ? `<span class="micro-text text-muted">${(file.size / 1024).toFixed(1)} KB</span>` : ''}
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <button type="button" class="btn btn-sm btn-primary fw-semibold rounded-pill px-3 py-1 text-nowrap btn-open-online-viewer" data-index="${index}">
                                    <i class="bi bi-eye me-1"></i> Read Online
                                </button>
                                <a href="${fileUrl}" download="${file.name || 'download'}" class="btn btn-sm btn-outline-success fw-semibold rounded-pill px-3 py-1 text-nowrap">
                                    <i class="bi bi-download me-1"></i> Download
                                </a>
                                <button type="button" class="btn btn-sm btn-outline-danger delete-file-btn rounded-pill px-2 py-1" data-index="${index}" title="Delete File"><i class="bi bi-trash"></i></button>
                            </div>
                        `;
                        fileList.appendChild(li);
                    });

                    fileList.querySelectorAll('.btn-open-online-viewer').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const idx = parseInt(btn.dataset.index, 10);
                            const targetFile = currentTopic.files[idx];
                            if (targetFile) {
                                openOnlineDocViewer(targetFile.name, targetFile.dataUrl);
                            }
                        });
                    });
                } else {
                    fileList.innerHTML = '<li class="list-group-item text-muted text-center py-3">No files have been uploaded for this topic yet.</li>';
                }
            }

            function handleFileUpload(files) {
                if (!currentTopic) return;
                if (!currentTopic.files) currentTopic.files = [];

                const filePromises = [];

                for (const file of files) {
                    const promise = new Promise((resolve, reject) => {
                        if (file.size > 25 * 1024 * 1024) {
                            alert(`File "${file.name}" is too large (max 25MB) and will not be saved.`);
                            resolve(null); // Resolve with null to skip this file.
                            return;
                        }

                        const reader = new FileReader();
                        reader.onload = (event) => {
                            resolve({
                                name: file.name,
                                size: file.size,
                                dataUrl: event.target.result
                            });
                        };
                        reader.onerror = (error) => {
                            console.error("File reading error:", error);
                            reject(error);
                        };
                        reader.readAsDataURL(file);
                    });
                    filePromises.push(promise);
                }

                Promise.all(filePromises).then(fileDataArray => {
                    const validFiles = fileDataArray.filter(f => f !== null);
                    if (validFiles.length > 0) {
                        currentTopic.files.push(...validFiles);
                        saveData();
                        renderFileList();
                        alert(`${validFiles.length} file(s) added successfully!`);
                    }
                }).catch(error => {
                    console.error("Error processing files:", error);
                    alert("An error occurred while reading the files.");
                });
            }

            // Event Listeners
            const browseFilesBtn = document.getElementById('browseFilesBtn');
            const fileUploadInput = document.getElementById('fileUploadInput');
            browseFilesBtn.addEventListener('click', () => fileUploadInput.click());
            fileUploadInput.addEventListener('change', (e) => handleFileUpload(e.target.files));

            document.getElementById('fileList').addEventListener('click', (e) => {
                const deleteBtn = e.target.closest('.delete-file-btn');
                if (deleteBtn) {
                    const index = deleteBtn.dataset.index;
                    if (confirm(`Are you sure you want to delete this file?`)) {
                        currentTopic.files.splice(index, 1);
                        saveData();
                        renderFileList();
                    }
                }
            });

            // Live date and time
            function updateDateTime() {
                const liveDateElement = document.getElementById('liveDate');
                const liveTimeElement = document.getElementById('liveTime');
                if (!liveDateElement || !liveTimeElement) return;

                const now = new Date();
                const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                liveDateElement.textContent = now.toLocaleDateString('en-US', dateOptions);
                const timeOptions = { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true };
                liveTimeElement.textContent = now.toLocaleTimeString('en-US', timeOptions);
            }
            updateDateTime();
            setInterval(updateDateTime, 1000);

            // Initial Load
            loadData();
        });
    </script>
</body>

</html>
