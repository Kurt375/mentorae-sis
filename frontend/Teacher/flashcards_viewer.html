<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Flashcards Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="subject_detail_teacher.css?v=1.1">
    <link rel="stylesheet" href="flashcards_viewer.css?v=1.2">
</head>
<body class="dashboard-bg">
    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        <!-- Header Ribbon Navbar -->
        <nav class="navbar navbar-dark custom-navbar py-3 border-bottom">
            <div class="container-fluid px-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-3">
                    <a href="#" class="text-white text-decoration-none fs-4 link-transition" id="backBtn" aria-label="Go Back" onclick="window.history.back(); return false;">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                    <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                        <img src="../TSHS_image.png" alt="School Logo" class="school-logo-img">
                    </div>
                    <div>
                        <h1 class="navbar-brand m-0 fs-4 fw-bold tracking-wide d-inline-block" id="pageTitle">Flashcards Viewer</h1>
                        <p class="m-0 micro-text text-white-50 opacity-75 d-none d-sm-block" id="pageSubtitle">Topic: Loading...</p>
                    </div>
                </div>
                <div class="text-white text-end dashboard-time">
                    <div class="small opacity-75" id="liveDate"></div>
                    <div class="fs-4 fw-bold m-0" id="liveTime"></div>
                </div>
            </div>
        </nav>

        <main class="container-fluid px-4 py-4 flex-grow-1 workspace-content-fill">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 fw-bold text-dark" id="flashcardSetTitle">Flashcard Set for...</h2>
                <button class="btn btn-sm btn-outline-secondary" id="shuffleBtn">
                    <i class="bi bi-shuffle me-2"></i>Shuffle
                </button>
            </div>

            <div class="flashcard-container mx-auto mb-4" id="flashcardContainer">
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-front">
                        <p class="h4 fw-bold" id="flashcardTerm">Loading term...</p>
                    </div>
                    <div class="flashcard-back">
                        <p class="h5" id="flashcardDefinition">Loading definition...</p>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-center align-items-center mb-3 gap-3">
                <button class="btn btn-outline-primary" id="prevCardBtn" disabled>
                    <i class="bi bi-arrow-left-circle"></i> Previous
                </button>
                <button class="btn btn-study-action btn-lg" id="flipCardBtn">
                    <i class="bi bi-arrow-repeat"></i> Flip Card
                </button>
                <button class="btn btn-outline-primary" id="nextCardBtn" disabled>
                    Next <i class="bi bi-arrow-right-circle"></i>
                </button>
            </div>

            <div class="text-center text-muted small mb-1">
                Card <span id="currentCardIndex">0</span> of <span id="totalCards">0</span>
            </div>

            <div class="progress mx-auto mb-3" style="max-width: 500px; height: 8px;">
                <div class="progress-bar bg-success" id="flashcardProgress" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            </div>

            <div class="card shadow-sm p-4 mb-4">
                <h5 class="card-title fw-bold mb-3">Flashcard Set Details</h5>
                <div class="micro-text">
                    <p class="mb-1"><strong>Subject:</strong> <span id="subjectNameDisplay">N/A</span></p>
                    <p class="mb-1"><strong>Topic:</strong> <span id="topicTitleDisplay">N/A</span></p>
                    <p class="mb-0"><strong>Description:</strong> <span id="topicDescriptionDisplay">N/A</span></p>
                </div>
            </div>

        </main>

        <footer class="bg-light py-3 mt-auto border-top">
            <div class="container-fluid portal-wrapper text-center text-muted micro-text">
                Mentorae &copy; 2026. All rights reserved.
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="flashcards_viewer.js"></script>
</body>
</html>
