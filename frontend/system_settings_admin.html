<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - System Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="system_settings_admin.css">
</head>
<body class="dashboard-bg">

    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        
        <header class="custom-navbar text-white py-3 px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard_admin.html" class="text-white text-decoration-none fs-4 link-transition" id="backToDashboardBtn" aria-label="Go Back">
                    <i class="bi bi-chevron-left"></i>
                </a>
                <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                    <img src="TSHS_image.png" alt="School Logo" class="school-logo-img">
                </div>
                <div>
                    <h1 class="m-0 fs-4 fw-bold tracking-wide">System Settings</h1>
                    <p class="m-0 micro-text text-white-50 opacity-75 d-none d-sm-block">Configure dashboard preferences and network security</p>
                </div>
            </div>
            <div class="text-white text-end dashboard-time">
                <div class="small opacity-75" id="liveDate"></div>
                <div class="fs-4 fw-bold m-0" id="liveTime"></div>
            </div>
        </header>

        <main class="container-fluid px-4 py-4 flex-grow-1 workspace-content-fill">
            
            <div class="row g-4 mb-4">
                <div class="col-12 col-md-3">
                    <div class="card border-0 shadow-sm rounded-3 overflow-hidden p-2 sidebar-nav bg-white h-100">
                        <ul class="nav flex-column gap-1" id="settingsTabs">
                            <li class="nav-item">
                                <button class="nav-link w-100 text-start active d-flex align-items-center gap-3" data-target="general">
                                    <i class="bi bi-gear-fill"></i> General
                                </button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link w-100 text-start d-flex align-items-center gap-3" data-target="notifications">
                                    <i class="bi bi-bell-fill"></i> Notifications
                                </button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link w-100 text-start d-flex align-items-center gap-3" data-target="security">
                                    <i class="bi bi-shield-lock-fill"></i> Security
                                </button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link w-100 text-start d-flex align-items-center gap-3" data-target="database">
                                    <i class="bi bi-database-fill"></i> Database
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="col-12 col-md-9">
                    <div class="card border-0 shadow-sm rounded-4 p-4 min-panel-height bg-white" id="settingsContentPanel">
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-save-global w-100 py-3 fw-bold d-flex align-items-center justify-content-center gap-2 shadow-sm" id="btnSaveAll">
                <i class="bi bi-floppy-fill"></i> Save All Settings
            </button>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="session.js"></script>
    <script src="system_settings_admin.js"></script>
</body>
</html>
