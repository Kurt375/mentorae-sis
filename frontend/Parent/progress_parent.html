<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Student Progress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard_parent.css">
    <style>
        table { width: 100%; font-size: 13px; }
        th, td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
    </style>
</head>
<body class="dashboard-bg">
    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        <nav class="custom-navbar text-white py-3 px-4 d-flex align-items-center gap-3">
            <a href="dashboard_parent.html" class="text-white text-decoration-none fs-4"><i class="bi bi-chevron-left"></i></a>
            <div class="flex-grow-1">
                <h1 class="m-0 fs-4 fw-bold">Student Progress</h1>
                <p class="m-0 small opacity-75">Grades &amp; attendance details</p>
            </div>
            <button type="button" id="btnDownloadFullReport" class="btn btn-sm btn-light">
                <i class="bi bi-file-earmark-arrow-down"></i> Full Report
            </button>
        </nav>
        <main class="container-fluid px-4 py-4 flex-grow-1">
            <div class="row g-3 mb-4">
                <div class="col-6">
                    <div class="card border-0 shadow-sm p-3 text-center">
                        <span class="text-muted small text-uppercase">Overall Grade</span>
                        <h3 class="fw-bold m-0" id="overallGradeVal">—</h3>
                    </div>
                </div>
                <div class="col-6">
                    <div class="card border-0 shadow-sm p-3 text-center">
                        <span class="text-muted small text-uppercase">Attendance Rate</span>
                        <h3 class="fw-bold m-0" id="attendanceRateVal">—</h3>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm p-3 mb-4">
                <h5 class="fw-bold mb-2">Grades by Subject</h5>
                <table>
                    <thead><tr><th>Subject</th><th>Term</th><th>Average</th><th>Remarks</th></tr></thead>
                    <tbody id="gradesBody"></tbody>
                </table>
                <p class="text-muted small text-center py-3 d-none" id="emptyGrades">No grades posted yet.</p>
            </div>

            <div class="card border-0 shadow-sm p-3">
                <h5 class="fw-bold mb-2">Recent Attendance</h5>
                <table>
                    <thead><tr><th>Date</th><th>Status</th><th>Time In</th></tr></thead>
                    <tbody id="attendanceBody"></tbody>
                </table>
                <p class="text-muted small text-center py-3 d-none" id="emptyAttendance">No attendance records yet.</p>
            </div>
        </main>
    </div>

    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script>
        const { token } = requireSession('../login.html');
        const params = new URLSearchParams(window.location.search);
        const studentId = params.get('studentId');
        if (!studentId) window.location.href = 'dashboard_parent.html';

        async function loadGrades() {
            const data = await authedFetch(`/api/grades/student/${studentId}`, token);
            if (!data.success) return;
            document.getElementById('overallGradeVal').textContent = data.overallGrade ? `${data.overallGrade}%` : '—';
            const tbody = document.getElementById('gradesBody');
            if (!data.grades.length) {
                document.getElementById('emptyGrades').classList.remove('d-none');
                return;
            }
            for (const g of data.grades) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${g.subject}</td><td>${g.term}</td><td>${g.average}</td><td>${g.remarks}</td>`;
                tbody.appendChild(tr);
            }
        }

        function formatTime(t) {
            if (!t) return '-';
            const [h, m] = t.split(':');
            const d = new Date(); d.setHours(Number(h), Number(m));
            return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        async function loadAttendance() {
            const [summary, history] = await Promise.all([
                authedFetch(`/api/attendance/summary?studentId=${studentId}`, token),
                authedFetch(`/api/attendance/history?studentId=${studentId}&limit=15`, token),
            ]);
            if (summary.success) {
                document.getElementById('attendanceRateVal').textContent = `${summary.rate}%`;
            }
            const tbody = document.getElementById('attendanceBody');
            if (!history.success || !history.history.length) {
                document.getElementById('emptyAttendance').classList.remove('d-none');
                return;
            }
            for (const row of history.history) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${row.scan_date}</td><td>${row.status}</td><td>${formatTime(row.scan_time)}</td>`;
                tbody.appendChild(tr);
            }
        }

        async function downloadFullReport() {
            const [gradesData, summary, badgesData] = await Promise.all([
                authedFetch(`/api/grades/student/${studentId}`, token),
                authedFetch(`/api/attendance/summary?studentId=${studentId}`, token),
                authedFetch(`/api/badges/student/${studentId}`, token),
            ]);

            const gwa = gradesData.success && gradesData.overallGrade ? `${gradesData.overallGrade}%` : '—';
            const attendanceRate = summary.success ? `${summary.rate}%` : '—';
            const badgeCount = badgesData.success ? (badgesData.badges || []).length : 0;

            const subjectRows = (gradesData.success ? gradesData.grades || [] : [])
                .map((g) => `<tr><td>${g.subject}</td><td>${g.term}</td><td>${g.average}</td><td>${g.remarks}</td></tr>`)
                .join('');
            const badgeRows = (badgesData.success ? badgesData.badges || [] : [])
                .map((b) => `<li>${b.name} — earned ${new Date(b.earned_at).toLocaleDateString()}</li>`)
                .join('');

            const w = window.open('', '_blank');
            w.document.write(`
                <html><head><title>Student Progress Report</title>
                <style>
                    body { font-family: sans-serif; padding: 2.5rem; }
                    .summary { display: flex; gap: 2rem; margin-bottom: 1.5rem; }
                    .summary div { border: 1px solid #dee2e6; border-radius: 8px; padding: 0.75rem 1.25rem; }
                    table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
                    th, td { border: 1px solid #dee2e6; padding: 0.5rem; text-align: left; font-size: 0.9rem; }
                    th { background: #f1f3f5; }
                </style></head>
                <body>
                    <h1>Mentorae — Student Progress Report</h1>
                    <p style="color:#6c757d;">Generated ${new Date().toLocaleDateString()}</p>
                    <div class="summary">
                        <div><strong>GWA</strong><br>${gwa}</div>
                        <div><strong>Attendance Rate</strong><br>${attendanceRate}</div>
                        <div><strong>Badges Earned</strong><br>${badgeCount}</div>
                    </div>
                    <h3>Grades by Subject</h3>
                    <table><tr><th>Subject</th><th>Term</th><th>Average</th><th>Remarks</th></tr>${subjectRows || '<tr><td colspan="4">No grades yet.</td></tr>'}</table>
                    <h3>Badges</h3>
                    <ul>${badgeRows || '<li>No badges earned yet.</li>'}</ul>
                </body></html>
            `);
            w.document.close();
            w.print();
        }

        document.getElementById('btnDownloadFullReport').addEventListener('click', downloadFullReport);

        loadGrades();
        loadAttendance();
    </script>
</body>
</html>
