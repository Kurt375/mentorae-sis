<!DOCTYPE html>
<html lang="en">

<head>
  <script src="auth_guard.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentorae - Topic Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="subject_management_admin.css"> <!-- Re-use existing admin CSS -->
  <!-- Google Fonts for Presentation/Document Rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Temporary highlight for topic requests */
    .highlight-request {
      animation: highlightFade 3s ease-out;
    }

    @keyframes highlightFade {
      0% {
        background-color: #fff3cd;
      }

      /* Light yellow */
      100% {
        background-color: transparent;
      }
    }
  </style>
</head>

<body class="dashboard-bg">
  <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
    <header class="custom-navbar text-white py-3 px-4 d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <a href="dashboard_admin.html" class="text-white text-decoration-none fs-4 link-transition"
          aria-label="Go Back to Portal Dashboard">
          <i class="bi bi-chevron-left"></i>
        </a>
        <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
          <img src="TSHS_image.png" alt="School Logo" class="school-logo-img">
        </div>
        <div>
          <h1 class="m-0 fs-4 fw-bold tracking-wide">Topic Requests</h1>
          <p class="m-0 micro-text text-white-50 opacity-75 d-none d-sm-block">Review and approve teacher-submitted
            topics</p>
        </div>
      </div>
      <div class="text-white text-end dashboard-time">
        <div class="small opacity-75" id="liveDate"></div>
        <div class="fs-4 fw-bold m-0" id="liveTime"></div>
      </div>
    </header>

    <main class="container-fluid px-4 py-4 flex-grow-1 workspace-content-fill">
      <!-- Search & Filters Toolbar -->
      <div class="card border-0 shadow-sm p-3 rounded-3 bg-white mb-3">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-5">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white text-muted"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control" id="topicSearchInput" placeholder="Search topic title or teacher name...">
            </div>
          </div>
          <div class="col-6 col-md-3">
            <select class="form-select form-select-sm" id="topicStatusFilter">
              <option value="pending" selected>Pending Review</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
              <option value="all">All Statuses</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <select class="form-select form-select-sm" id="topicSubjectFilter">
              <option value="all" selected>All Subjects</option>
            </select>
          </div>
          <div class="col-12 col-md-1 text-end">
            <button type="button" class="btn btn-sm btn-outline-secondary w-100 fw-semibold" id="btnResetTopicFilters" title="Reset Filters">
              <i class="bi bi-arrow-counterclockwise"></i>
            </button>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top micro-text text-muted">
          <span id="topicRequestsCount" class="fw-semibold text-dark">Loading requests...</span>
        </div>
      </div>

      <div id="topicRequestsContainer" class="d-flex flex-column gap-3">
        <!-- Requests will be rendered here by JS -->
      </div>
    </main>
  </div>

  <!-- View Request Files Modal -->
  <div class="modal fade" id="viewRequestFilesModal" tabindex="-1" aria-labelledby="viewRequestFilesModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="viewRequestFilesModalLabel">View Attached Files</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="requestFilesContainer">
          <!-- Files will be rendered here by JS -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- View Request Quiz Modal -->
  <div class="modal fade" id="viewRequestQuizModal" tabindex="-1" aria-labelledby="viewRequestQuizModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="viewRequestQuizModalLabel">View Quiz Questions</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="requestQuizContainer">
          <!-- Quiz questions will be rendered here by JS -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- View Request Flashcards Modal -->
  <div class="modal fade" id="viewRequestFlashcardsModal" tabindex="-1"
    aria-labelledby="viewRequestFlashcardsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="viewRequestFlashcardsModalLabel">View Flashcards</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="requestFlashcardsContainer">
          <!-- Flashcards will be rendered here by JS -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Google Classroom Style Full-Screen File Viewer -->
  <div id="classroomFileViewer" class="classroom-viewer-overlay d-none">
    <!-- Top App Bar -->
    <header class="classroom-viewer-header d-flex justify-content-between align-items-center px-4 py-2.5">
      <div class="d-flex align-items-center gap-3 text-truncate">
        <button type="button" class="btn btn-dark rounded-circle p-2 d-flex align-items-center justify-content-center border-0 text-white-50" id="classroomViewerBackBtn" title="Back to Files">
          <i class="bi bi-arrow-left fs-5 text-white"></i>
        </button>
        <div class="d-flex align-items-center gap-2.5 text-truncate">
          <div class="classroom-viewer-icon-box" id="classroomViewerIconBox">
            <i class="bi bi-file-earmark-text fs-4 text-warning" id="classroomViewerIcon"></i>
          </div>
          <div class="text-truncate">
            <h1 class="fs-6 fw-bold text-white mb-0 text-truncate" id="classroomViewerFileName">Document.pdf</h1>
            <div class="micro-text text-white-50 text-truncate" id="classroomViewerSubtitle">Mentorae Topic Request Materials</div>
          </div>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div id="classroomViewerModeSwitcher" class="d-none d-md-flex align-items-center gap-1 bg-black bg-opacity-40 p-1 rounded-pill border border-secondary border-opacity-50 me-1"></div>
        <button type="button" class="btn btn-sm btn-outline-light rounded-pill px-3 py-1.5 fw-semibold d-none d-sm-inline-flex align-items-center gap-1.5" id="classroomViewerPrintBtn" title="Print document">
          <i class="bi bi-printer"></i> Print
        </button>
        <a href="#" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-light rounded-pill px-3 py-1.5 fw-semibold d-inline-flex align-items-center gap-1.5" id="classroomViewerPopoutBtn" title="Open in new window">
          <i class="bi bi-box-arrow-up-right"></i> <span class="d-none d-md-inline">Pop-out</span>
        </a>
        <a href="#" download class="btn btn-sm btn-primary rounded-pill px-3.5 py-1.5 fw-bold d-inline-flex align-items-center gap-1.5 shadow-sm" id="classroomViewerDownloadBtn" title="Download to device">
          <i class="bi bi-download"></i> Download
        </a>
        <button type="button" class="btn btn-dark rounded-circle p-2 d-flex align-items-center justify-content-center border-0 text-white ms-1" id="classroomViewerCloseBtn" title="Close">
          <i class="bi bi-x-lg fs-5"></i>
        </button>
      </div>
    </header>

    <!-- Main Workspace (Center Document Stage) -->
    <div class="classroom-viewer-stage" id="classroomViewerStage">
      <!-- Dynamic high-fidelity content rendered here -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.4/dist/docx-preview.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script src="session.js"></script>
  <script src="presentationOptimizer.js"></script>
  <script src="pptxToPdf.js"></script>
  <script src="topic_requests_admin.js"></script>
</body>

</html>
