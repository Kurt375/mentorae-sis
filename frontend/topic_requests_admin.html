<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Topic Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="subject_management_admin.css"> <!-- Re-use existing admin CSS -->
    <style>
        /* Temporary highlight for topic requests */
        .highlight-request {
            animation: highlightFade 3s ease-out;
        }
        @keyframes highlightFade {
            0% { background-color: #fff3cd; } /* Light yellow */
            100% { background-color: transparent; }
        }
    </style>
</head>
<body class="dashboard-bg">
    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        <header class="custom-navbar text-white py-3 px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard_admin.html" class="text-white text-decoration-none fs-4 link-transition" aria-label="Go Back to Portal Dashboard">
                    <i class="bi bi-chevron-left"></i>
                </a>
                <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                    <img src="TSHS_image.png" alt="School Logo" class="school-logo-img">
                </div>
                <div>
                    <h1 class="m-0 fs-4 fw-bold tracking-wide">Topic Requests</h1>
                    <p class="m-0 micro-text text-white-50 opacity-75 d-none d-sm-block">Review and approve teacher-submitted topics</p>
                </div>
            </div>
            <div class="text-white text-end dashboard-time">
                <div class="small opacity-75" id="liveDate"></div>
                <div class="fs-4 fw-bold m-0" id="liveTime"></div>
            </div>
        </header>

        <main class="container-fluid px-4 py-4 flex-grow-1 workspace-content-fill">
            <div id="topicRequestsContainer" class="d-flex flex-column gap-3">
                <!-- Requests will be rendered here by JS -->
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="topic_requests_admin.js"></script>

    <!-- View Request Files Modal -->
    <div class="modal fade" id="viewRequestFilesModal" tabindex="-1" aria-labelledby="viewRequestFilesModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="viewRequestFilesModalLabel">View Attached Files</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="requestFilesContainer">
            <!-- Files will be rendered here by JS -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- View Request Quiz Modal -->
    <div class="modal fade" id="viewRequestQuizModal" tabindex="-1" aria-labelledby="viewRequestQuizModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="viewRequestQuizModalLabel">View Quiz Questions</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="requestQuizContainer">
            <!-- Quiz questions will be rendered here by JS -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Done</button>
          </div>
        </div>
      </div>
    </div>

    <!-- View Request Flashcards Modal -->
    <div class="modal fade" id="viewRequestFlashcardsModal" tabindex="-1" aria-labelledby="viewRequestFlashcardsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="viewRequestFlashcardsModalLabel">View Flashcards</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="requestFlashcardsContainer">
            <!-- Flashcards will be rendered here by JS -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Done</button>
          </div>
        </div>
      </div>
    </div>

</body>
</html>
