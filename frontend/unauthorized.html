<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied | Mentorae</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-green: #0a5c2c;
            --primary-hover: #074621;
        }
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .error-card {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            text-align: center;
        }
        .error-header {
            background: linear-gradient(135deg, #dc3545, #b02a37);
            color: white;
            padding: 2.5rem 1.5rem;
        }
        .error-icon {
            font-size: 3.5rem;
            line-height: 1;
            margin-bottom: 0.75rem;
        }
        .error-body {
            padding: 2rem 2rem 2.5rem;
        }
        .btn-return {
            background-color: var(--primary-green);
            color: white;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            border: none;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-return:hover {
            background-color: var(--primary-hover);
            color: white;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-header">
            <div class="error-icon"><i class="bi bi-shield-lock-fill"></i></div>
            <h1 class="h3 fw-bold mb-1">403 - Access Denied</h1>
            <p class="mb-0 text-white-50 small">Authorization Required</p>
        </div>
        <div class="error-body">
            <h2 class="h5 fw-bold text-dark mb-2">Restricted Area</h2>
            <p class="text-secondary small mb-4">
                You do not have permission or the required role privileges to access this page or portal resource. Please return to your designated dashboard.
            </p>
            <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                <a href="#" id="returnHomeBtn" class="btn-return">
                    <i class="bi bi-arrow-left me-1"></i> Return to Portal
                </a>
                <button type="button" class="btn btn-outline-secondary rounded-3 px-3 py-2 fw-semibold" id="logoutBtn">
                    <i class="bi bi-box-arrow-right me-1"></i> Log Out
                </button>
            </div>
            <div class="mt-4 pt-3 border-top text-muted micro-text" style="font-size: 0.75rem;">
                Talisay Senior High School • Mentorae Student Information System
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="session.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('mentorae_user') || 'null');
        const returnBtn = document.getElementById('returnHomeBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        let targetUrl = 'login.html';
        if (user && user.role) {
            const role = String(user.role).toLowerCase();
            if (role === 'admin') targetUrl = 'dashboard_admin.html';
            else if (role === 'teacher') targetUrl = 'Teacher/dashboard_teacher.html';
            else if (role === 'student') targetUrl = 'Student/dashboard_student.html';
            else if (role === 'parent') targetUrl = 'Parent/dashboard_parent.html';
        }
        returnBtn.href = targetUrl;

        logoutBtn.addEventListener('click', () => {
            clearSession('login.html');
        });
    </script>
</body>
</html>
