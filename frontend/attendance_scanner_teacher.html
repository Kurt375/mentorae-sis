<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Attendance Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="attendance_scanner_teacher.css">
</head>

<body class="dashboard-bg">

    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        
        <header class="custom-navbar text-white py-3 px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="#" class="text-white text-decoration-none fs-4 link-transition" id="backToDashboardBtn" aria-label="Go Back">
                    <i class="bi bi-chevron-left"></i>
                </a>
                <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                    <img src="TSHS_image.png" alt="School Logo" class="school-logo-img">
                </div>
                <div>
                    <h1 class="m-0 fs-4 fw-bold tracking-wide d-inline-block">Attendance Scanner</h1>
                    <p class="m-0 micro-text text-white-50 opacity-75 d-none d-sm-block">Real-time room validation tracking</p>
                </div>
            </div>
            <div class="text-white text-end dashboard-time">
                <div class="small opacity-75" id="liveDate"></div>
                <div class="fs-4 fw-bold m-0" id="liveTime"></div>
            </div>
        </header>

        <main class="flex-grow-1 position-relative campus-backdrop-wrapper p-4 d-flex align-items-center justify-content-center">
            <div class="container-fluid">
                <div class="row g-4 align-items-center justify-content-center">
                    
                    <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-end">
                        <div class="scanner-card shadow-lg overflow-hidden border border-secondary">
                            <div class="viewfinder-lens position-relative p-4 bg-dark d-flex align-items-center justify-content-center">
                                <video id="scannerVideo" playsinline class="position-absolute top-0 start-0 w-100 h-100 d-none"></video>
                                <div class="reticle-bracket top-left"></div>
                                <div class="reticle-bracket top-right"></div>
                                <div class="reticle-bracket bottom-left"></div>
                                <div class="reticle-bracket bottom-right"></div>
                                
                                <div class="center-laser-guide d-flex align-items-center justify-content-center">
                                    <div class="inner-laser-box animate-pulse-fast"></div>
                                </div>
                            </div>
                            <div class="scanner-footer text-center p-3 text-white">
                                <button type="button" class="btn btn-scan-action px-4 py-2.5 fw-bold text-dark d-inline-flex align-items-center gap-2 shadow-sm mb-2" id="startScanBtn" title="Start camera">
                                    <i class="bi bi-camera-fill"></i> Scan QR Here
                                </button>
                                <button type="button" class="btn btn-danger px-4 py-2.5 fw-bold text-white d-inline-flex align-items-center gap-2 shadow-sm mb-2" id="stopScanBtn" title="Stop camera" disabled>
                                    <i class="bi bi-camera-video-off-fill"></i> Stop Camera
                                </button>
                                <div class="small fw-semibold text-white-50 tracking-wide" id="scannerStatusText">Ready to Scan</div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-start">
                        <div class="student-profile-ticket position-relative shadow-lg bg-white p-4 text-center border-0 d-flex flex-column align-items-center justify-content-between" id="profileTicket">
                            <div class="ticket-notch top-notch"></div>
                            
                            <div class="w-100 my-auto">
                                <div class="ticket-avatar-frame border mx-auto mb-3 shadow-sm bg-light overflow-hidden">
                                    <i class="bi bi-person-fill text-secondary display-4 d-flex align-items-center justify-content-center h-100" id="studentImg"></i>
                                </div>

                                <h2 class="h5 fw-bold text-dark m-0 mb-2" id="studentName">Awaiting Scan</h2>
                                
                                <div class="d-flex align-items-center justify-content-center gap-2 mb-2 text-secondary fw-semibold">
                                    <i class="bi bi-qr-code text-success fs-5"></i>
                                    <span class="tracking-sm fs-6" id="studentID">—</span>
                                </div>

                                <hr class="w-70 mx-auto my-3 opacity-25">

                                <div class="d-inline-flex align-items-center gap-2 px-3 py-1.5 rounded-pill alert-success-custom fs-6 fw-semibold" id="studentMetaWrap">
                                    <i class="bi bi-check-circle-fill text-success"></i>
                                    <span id="studentStrand">—</span>
                                </div>
                            </div>

                            <div class="ticket-notch bottom-notch"></div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="config.js"></script>
    <script src="session.js"></script>
    <script src="attendance_scanner_teacher.js"></script>

    <!-- Audio elements for scan feedback. NOTE: You need to provide the actual sound files in a 'sounds' folder. -->
    <!-- Optional scan sound effects — add your own audio files here if desired -->
    <audio id="scanSuccessSound" preload="none"></audio>
    <audio id="scanFailSound" preload="none"></audio>
</body>
</html>
