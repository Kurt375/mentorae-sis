<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Flashcards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../Teacher/learning_resources_teacher.css">
    <link rel="stylesheet" href="../Teacher/subject_detail_teacher.css?v=1.1">
    <link rel="stylesheet" href="../Teacher/flashcards_viewer.css?v=1.2">
</head>
<body class="dashboard-bg">
    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        <!-- Header -->
        <nav class="navbar navbar-dark custom-navbar py-3 border-bottom">
            <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <a href="#" onclick="history.back(); return false;" class="text-white text-decoration-none fs-4 link-transition" aria-label="Go Back">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                    <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                        <img src="../TSHS_image.png" alt="School Logo" class="school-logo-img">
                    </div>
                    <div>
                        <h1 class="navbar-brand m-0 fs-4 fw-bold tracking-wide d-inline-block" id="pageTitle">Flashcards Viewer</h1>
                        <p class="m-0 micro-text text-white-50 opacity-75 d-none d-sm-block" id="pageSubtitle">Topic: N/A</p>
                    </div>
                </div>
                <div class="text-white text-end dashboard-time">
                    <div class="small opacity-75" id="liveDate"></div>
                    <div class="fs-4 fw-bold m-0" id="liveTime"></div>
                </div>
            </div>
        </nav>

        <main class="container-fluid px-4 py-4 flex-grow-1 workspace-content-fill">
            <!-- Modern Topic Context Banner -->
            <div class="card border-0 shadow-sm rounded-4 mb-4" style="background: linear-gradient(135deg, #ffffff 0%, #f8fbf9 100%); border-left: 5px solid #0a5c2c !important;">
                <div class="card-body p-3 p-md-4">
                    <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3">
                        <div class="d-flex align-items-start gap-3">
                            <div class="bg-warning-subtle text-warning-emphasis rounded-3 d-flex align-items-center justify-content-center flex-shrink-0" style="width: 48px; height: 48px;">
                                <i class="bi bi-stack fs-4 text-warning"></i>
                            </div>
                            <div>
                                <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                                    <span class="badge bg-success-subtle text-success border border-success-subtle px-2.5 py-1 rounded-pill fw-semibold micro-text">
                                        <i class="bi bi-book-half me-1"></i><span id="subjectNameDisplay">Subject</span>
                                    </span>
                                    <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-2.5 py-1 rounded-pill fw-semibold micro-text">
                                        <i class="bi bi-card-text me-1"></i> Flashcard Deck
                                    </span>
                                </div>
                                <h2 class="h5 fw-bold text-dark m-0" id="topicTitleDisplay">Loading Topic...</h2>
                                <p class="text-muted small m-0 mt-1" id="topicDescriptionDisplay">Loading description...</p>
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1.5 fw-semibold d-inline-flex align-items-center gap-1" id="shuffleBtn">
                                <i class="bi bi-shuffle"></i> Shuffle
                            </button>
                            <button type="button" onclick="window.history.back(); return false;" class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1.5 fw-semibold d-inline-flex align-items-center gap-1">
                                <i class="bi bi-arrow-left"></i> Back to Topics
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <span id="flashcardSetTitle" class="d-none"></span>

            <div id="flashcardApp" class="d-none">
                <div class="flashcard-container mx-auto mb-4" id="flashcardContainer">
                    <div class="flashcard" id="flashcard">
                        <div class="flashcard-front">
                            <p class="h4 fw-bold" id="flashcardTerm">Loading term...</p>
                        </div>
                        <div class="flashcard-back">
                            <p class="h5" id="flashcardDefinition">Loading definition...</p>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-center align-items-center mb-3 gap-3">
                    <button class="btn btn-outline-primary" id="prevCardBtn" disabled>
                        <i class="bi bi-arrow-left-circle"></i> Previous
                    </button>
                    <button class="btn btn-study-action btn-lg" id="flipCardBtn">
                        <i class="bi bi-arrow-repeat"></i> Flip Card
                    </button>
                    <button class="btn btn-outline-primary" id="nextCardBtn" disabled>
                        Next <i class="bi bi-arrow-right-circle"></i>
                    </button>
                </div>

                <div class="text-center text-muted small mb-1">
                    Card <span id="currentCardIndex">0</span> of <span id="totalCards">0</span>
                </div>

                <div class="progress mx-auto mb-4" style="max-width: 500px; height: 8px;">
                    <div class="progress-bar bg-success" id="flashcardProgress" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
            <div id="noFlashcardsAlert" class="alert alert-warning text-center d-none">No flashcards are available for this topic.</div>
        </main>

        <footer class="bg-light py-3 mt-auto border-top">
            <div class="container-fluid portal-wrapper text-center text-muted micro-text">
                Mentorae &copy; 2026. All rights reserved.
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script src="flashcard_viewer_student.js"></script>
</body>
</html>
