<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Grade &amp; Performance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard_student.css">
</head>
<body class="dashboard-bg">
    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        <nav class="custom-navbar text-white py-3 px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard_student.html" class="text-white text-decoration-none fs-4"><i class="bi bi-chevron-left"></i></a>
                <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                    <img src="TSHS_image.png" alt="School Logo" class="school-logo-img">
                </div>
                <div>
                    <h1 class="m-0 fs-4 fw-bold tracking-wide">Grade &amp; Performance</h1>
                    <p class="m-0 micro-text opacity-75">Your academic records</p>
                </div>
            </div>
            <div class="text-white text-end dashboard-time">
                <div class="small opacity-75" id="liveDate"></div>
                <div class="fs-4 fw-bold m-0" id="liveTime"></div>
            </div>
        </nav>

        <main class="container-fluid px-4 py-4 flex-grow-1">
            <div class="card border-0 shadow-sm p-3 mb-4 text-center" style="max-width:220px;">
                <span class="text-muted fw-semibold tiny-text text-uppercase">Overall Grade</span>
                <h2 class="fw-bold fs-2 text-dark m-0" id="overallGradeVal">—</h2>
            </div>

            <div class="card border-0 shadow-sm overflow-hidden rounded-3">
                <div class="table-responsive">
                    <table class="table table-striped text-sm align-middle m-0">
                        <thead>
                            <tr class="table-header-row text-white">
                                <th class="px-3 py-2">Subject</th>
                                <th class="px-3 py-2">Term</th>
                                <th class="px-3 py-2 text-center">Quiz</th>
                                <th class="px-3 py-2 text-center">Activity</th>
                                <th class="px-3 py-2 text-center">Exam</th>
                                <th class="px-3 py-2 text-center">Average</th>
                                <th class="px-3 py-2">Remarks</th>
                            </tr>
                        </thead>
                        <tbody id="gradesBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script>
        const { token } = requireSession('../login.html');

        function updateDateTime() {
            const now = new Date();
            document.getElementById('liveDate').textContent = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('liveTime').textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        async function load() {
            const data = await authedFetch('/api/grades/mine', token);
            if (!data.success) return;
            document.getElementById('overallGradeVal').textContent = data.overallGrade ? `${data.overallGrade}%` : '—';
            const tbody = document.getElementById('gradesBody');
            if (!data.grades.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No grades posted yet.</td></tr>';
                return;
            }
            for (const g of data.grades) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-3 py-2 fw-medium">${g.subject}</td>
                    <td class="px-3 py-2 text-muted">${g.term}</td>
                    <td class="px-3 py-2 text-center">${g.quiz_score}</td>
                    <td class="px-3 py-2 text-center">${g.activity_score}</td>
                    <td class="px-3 py-2 text-center">${g.exam_score}</td>
                    <td class="px-3 py-2 text-center fw-bold">${g.average}</td>
                    <td class="px-3 py-2 text-muted micro-text">${g.remarks}</td>
                `;
                tbody.appendChild(tr);
            }
        }
        load();
    </script>
</body>
</html>
