<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Leaderboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard_student.css">
    <style>
        .rank-row { display: flex; align-items: center; gap: 0.9rem; padding: 0.75rem 1rem; border-radius: 0.6rem; }
        .rank-row + .rank-row { margin-top: 0.4rem; }
        .rank-row.me { background: #eafaf0; border: 1px solid #b7e4c7; }
        .rank-num { width: 2.1rem; text-align: center; font-weight: 700; flex-shrink: 0; }
        .rank-1 { color: #d4af37; font-size: 1.3rem; }
        .rank-2 { color: #a8a8a8; font-size: 1.2rem; }
        .rank-3 { color: #cd7f32; font-size: 1.2rem; }
        .rank-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #f1f3f5; flex-shrink: 0; }
        .rank-avatar-icon { width: 42px; height: 42px; border-radius: 50%; background: #f1f3f5; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #adb5bd; font-size: 1.3rem; }
    </style>
</head>
<body class="dashboard-bg">
    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        <nav class="custom-navbar text-white py-3 px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard_student.html" class="text-white text-decoration-none fs-4"><i class="bi bi-chevron-left"></i></a>
                <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                    <img src="TSHS_image.png" alt="School Logo" class="school-logo-img">
                </div>
                <div>
                    <h1 class="m-0 fs-4 fw-bold tracking-wide">Leaderboard</h1>
                    <p class="m-0 micro-text opacity-75">Badge points ranking</p>
                </div>
            </div>
        </nav>

        <main class="container-fluid px-4 py-4 flex-grow-1">
            <ul class="nav nav-pills mb-4" id="scopeTabs">
                <li class="nav-item"><button class="nav-link active" data-scope="section" type="button">My Section</button></li>
                <li class="nav-item"><button class="nav-link" data-scope="school" type="button">Whole School</button></li>
            </ul>

            <div class="card border-0 shadow-sm p-3">
                <div id="leaderboardList">
                    <p class="text-muted small text-center py-4">Loading…</p>
                </div>
            </div>
        </main>
    </div>

    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script src="leaderboard_student.js"></script>
</body>
</html>
