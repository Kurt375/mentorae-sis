<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Database Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="database_admin.css">
</head>
<body class="dashboard-bg">

    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        
        <header class="custom-navbar text-white py-3 px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard_admin.html" class="text-white text-decoration-none fs-4 link-transition" id="backToDashboardBtn" aria-label="Go Back to Portal Dashboard">
                    <i class="bi bi-chevron-left"></i>
                </a>
                <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                    <img src="TSHS_image.png" alt="School Logo" class="school-logo-img">
                </div>
                <div>
                    <h1 class="m-0 fs-4 fw-bold tracking-wide d-inline-block">Database Records</h1>
                    <p class="m-0 micro-text text-white-50 opacity-75 d-none d-sm-block">View and manage database tables</p>
                </div>
            </div>
            <div class="text-white text-end dashboard-time">
                <div class="small opacity-75" id="liveDate"></div>
                <div class="fs-4 fw-bold m-0" id="liveTime"></div>
            </div>
        </header>

        <main class="container-fluid px-4 py-4 flex-grow-1">
            
            <section class="row g-3 overview-separator">
                <div class="col-12 col-md-4">
                    <div class="card stat-metric-card interactive-stat-card highlighted-stat border-0 shadow-sm p-3 h-100" id="btnStudents">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <h2 class="fw-bold m-0 display-6 text-dark" id="studentsCountVal">—</h2>
                                <span class="text-muted fw-semibold micro-text text-uppercase tracking-sm">Students</span>
                            </div>
                            <div class="metric-icon-box text-dark opacity-85">
                                <i class="bi bi-mortarboard fs-1"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="card stat-metric-card interactive-stat-card border-0 shadow-sm p-3 h-100 bg-white" id="btnSubjects">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <h2 class="fw-bold m-0 display-6 text-dark" id="subjectsCountVal">—</h2>
                                <span class="text-muted fw-semibold micro-text text-uppercase tracking-sm">Subjects</span>
                            </div>
                            <div class="metric-icon-box text-dark opacity-85">
                                <i class="bi bi-book fs-1"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="card stat-metric-card interactive-stat-card border-0 shadow-sm p-3 h-100 bg-white" id="btnStrands">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <h2 class="fw-bold m-0 display-6 text-dark" id="strandsCountVal">—</h2>
                                <span class="text-muted fw-semibold micro-text text-uppercase tracking-sm">Strands</span>
                            </div>
                            <div class="metric-icon-box text-dark opacity-85">
                                <i class="bi bi-bookmark-dash-fill fs-1"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <div class="d-flex justify-content-end mb-2">
                <button type="button" id="btnExportCurrentCsv" class="btn btn-outline-success btn-sm">
                    <i class="bi bi-download"></i> Export CSV
                </button>
            </div>

            <div class="card border-0 shadow-sm overflow-hidden rounded-3 bg-white">
                <div class="table-responsive">
                    <table class="table align-middle m-0 text-sm db-record-table">
                        <thead id="tableHead">
                            </thead>
                        <tbody id="tableBody">
                            </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="session.js"></script>
    <script src="database_admin.js"></script>

</body>
</html>
