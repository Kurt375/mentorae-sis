<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Learning Resources</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard_teacher.css">
    <style>
        .file-row { border: 1px solid #e9ecef; border-radius: 0.5rem; padding: 0.6rem 0.9rem; }
        .file-row + .file-row { margin-top: 0.5rem; }
        .module-card { border: 1px solid #e9ecef; border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1rem; }
    </style>
</head>
<body class="dashboard-bg">
    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        <nav class="custom-navbar text-white py-3 px-4 d-flex align-items-center gap-3">
            <a href="dashboard_teacher.html" class="text-white text-decoration-none fs-4"><i class="bi bi-chevron-left"></i></a>
            <div>
                <h1 class="m-0 fs-4 fw-bold">Learning Resources</h1>
                <p class="m-0 small opacity-75">Post and update study materials for your students</p>
            </div>
        </nav>

        <main class="container-fluid px-4 py-4 flex-grow-1">
            <div class="row g-4">
                <div class="col-12 col-lg-4">
                    <div class="card border-0 shadow-sm p-4">
                        <h5 class="fw-bold mb-3">Post New Material</h5>
                        <form id="uploadForm">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Title</label>
                                <input type="text" class="form-control" id="titleInput" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Description <span class="text-muted fw-normal">(optional)</span></label>
                                <textarea class="form-control" id="descriptionInput" rows="2"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Section</label>
                                <select class="form-select" id="sectionSelect" required>
                                    <option value="">Loading sections…</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Subject</label>
                                <select class="form-select" id="subjectSelect" required>
                                    <option value="">Select a section first…</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Quarter</label>
                                <select class="form-select" id="quarterSelect" required>
                                    <option value="1st Quarter">1st Quarter</option>
                                    <option value="2nd Quarter">2nd Quarter</option>
                                    <option value="3rd Quarter">3rd Quarter</option>
                                    <option value="4th Quarter">4th Quarter</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Files</label>
                                <input type="file" class="form-control" id="filesInput" multiple
                                       accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.png,.jpg,.jpeg,.webp,.txt" required>
                                <div class="form-text">PDF, Word, PowerPoint, Excel, images, or text. Up to 10 files, 25MB each.</div>
                            </div>
                            <button type="submit" class="btn btn-success fw-semibold w-100" id="uploadBtn">
                                <i class="bi bi-cloud-upload"></i> Post Material
                            </button>
                        </form>
                    </div>
                </div>

                <div class="col-12 col-lg-8">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold m-0">Your Posted Materials</h5>
                        <select class="form-select form-select-sm w-auto" id="filterSection">
                            <option value="">All sections</option>
                        </select>
                    </div>
                    <div id="modulesList">
                        <p class="text-muted small">Loading…</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Hidden input used to pick a replacement file for a specific lesson file -->
    <input type="file" id="replaceFileInput" class="d-none"
           accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.png,.jpg,.jpeg,.webp,.txt">

    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script src="learning_resources_teacher.js"></script>
</body>
</html>
