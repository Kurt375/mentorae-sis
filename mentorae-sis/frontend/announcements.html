<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Announcements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --mentorae-green: #0a5c2c; --mentorae-bg-canvas: #f4f6f9; }
        body { background: var(--mentorae-bg-canvas); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .portal-wrapper { max-width: 900px; margin: 0 auto; min-height: 100vh; background: #fff; border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; }
        .custom-navbar { background: var(--mentorae-green); }
        .announce-card { border-radius: 12px; border: 1px solid #eee; padding: 16px; margin-bottom: 14px; }
        .announce-type { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 2px 10px; border-radius: 20px; }
        .type-event { background: #e0edff; color: #2554a0; }
        .type-academic { background: #e2f0d9; color: #385723; }
        .type-seminar { background: #fce4d6; color: #c65911; }
    </style>
</head>
<body>
    <div class="portal-wrapper shadow-sm d-flex flex-column">
        <nav class="custom-navbar text-white py-3 px-4 d-flex align-items-center gap-3">
            <a href="#" id="backLink" class="text-white text-decoration-none fs-4"><i class="bi bi-chevron-left"></i></a>
            <div>
                <h1 class="m-0 fs-4 fw-bold">Announcements</h1>
                <p class="m-0 small opacity-75">School events, academic notices &amp; seminars</p>
            </div>
        </nav>
        <main class="container-fluid px-4 py-4 flex-grow-1">
            <div id="announceList"></div>
            <p class="text-center text-muted py-4 d-none" id="emptyMsg">No announcements right now.</p>
        </main>
    </div>
    <script src="config.js"></script>
    <script src="session.js"></script>
    <script>
        const { token, user } = requireSession('login.html');

        const backPaths = {
            student: 'Student/dashboard_student.html',
            teacher: 'Teacher/dashboard_teacher.html',
            parent: 'Parent/dashboard_parent.html',
            admin: 'dashboard_admin.html',
        };
        document.getElementById('backLink').addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = backPaths[user.role] || 'login.html';
        });

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' });
        }

        async function load() {
            const data = await authedFetch('/api/announcements', token);
            const list = document.getElementById('announceList');
            list.innerHTML = '';
            if (!data.success || !data.announcements.length) {
                document.getElementById('emptyMsg').classList.remove('d-none');
                return;
            }
            for (const a of data.announcements) {
                const div = document.createElement('div');
                div.className = 'announce-card';
                div.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="fw-bold m-0">${a.title}</h5>
                        <span class="announce-type type-${a.type}">${a.type}</span>
                    </div>
                    <p class="text-muted small mb-2"><i class="bi bi-calendar-event"></i> ${formatDate(a.event_date)}</p>
                    <p class="mb-0">${a.description}</p>
                `;
                list.appendChild(div);
            }
        }
        load();
    </script>
</body>
</html>
