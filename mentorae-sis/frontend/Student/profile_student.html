<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard_student.css">
</head>
<body class="dashboard-bg">
    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        <nav class="custom-navbar text-white py-3 px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard_student.html" class="text-white text-decoration-none fs-4"><i class="bi bi-chevron-left"></i></a>
                <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                    <img src="TSHS_image.png" alt="School Logo" class="school-logo-img">
                </div>
                <div>
                    <h1 class="m-0 fs-4 fw-bold tracking-wide">My Profile</h1>
                    <p class="m-0 micro-text opacity-75">Personal information</p>
                </div>
            </div>
        </nav>

        <main class="container-fluid px-4 py-4 flex-grow-1">
            <div class="card profile-banner border-0 text-white p-4 mb-4 shadow-sm">
                <div class="d-flex align-items-center gap-4">
                    <div class="avatar-photo-wrap rounded-circle border border-2 border-white overflow-hidden bg-light flex-shrink-0" id="avatarWrap">
                        <i class="bi bi-person-fill text-secondary display-6 d-flex align-items-center justify-content-center h-100" id="avatarIcon"></i>
                        <img id="avatarImg" class="w-100 h-100 d-none" style="object-fit: cover;" alt="Profile photo">
                    </div>
                    <div>
                        <h2 class="fw-bold m-0 fs-4 text-white" id="profileName">—</h2>
                        <p class="m-0 text-white-50 small mt-1" id="profileSection">—</p>
                        <div class="d-flex gap-1 mt-2" id="bannerBadgeStrip"></div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm p-4 mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0">Badges</h5>
                    <a href="leaderboard_student.html" class="small text-decoration-none">View Leaderboard <i class="bi bi-arrow-right"></i></a>
                </div>
                <div class="row g-2" id="profileBadgeGrid"></div>
                <p class="text-muted small text-center py-2 d-none" id="profileEmptyBadges">No badges earned yet.</p>
            </div>

            <div class="card border-0 shadow-sm p-4 mb-4">
                <h5 class="fw-bold mb-3">Account Information</h5>
                <div class="row g-3">
                    <div class="col-6"><span class="text-muted tiny-text text-uppercase d-block">Student ID</span><span class="fw-semibold" id="idNumberVal">—</span></div>
                    <div class="col-6"><span class="text-muted tiny-text text-uppercase d-block">Email</span><span class="fw-semibold" id="emailVal">—</span></div>
                    <div class="col-6"><span class="text-muted tiny-text text-uppercase d-block">Section</span><span class="fw-semibold" id="sectionVal">—</span></div>
                    <div class="col-6"><span class="text-muted tiny-text text-uppercase d-block">Role</span><span class="fw-semibold">Student</span></div>
                    <div class="col-6"><span class="text-muted tiny-text text-uppercase d-block">Semester</span><span class="fw-semibold" id="semesterVal">—</span></div>
                    <div class="col-6"><span class="text-muted tiny-text text-uppercase d-block">School Year</span><span class="fw-semibold" id="schoolYearVal">—</span></div>
                </div>
            </div>

            <div class="card border-0 shadow-sm p-4">
                <h5 class="fw-bold mb-3">Edit Profile</h5>
                <form id="editProfileForm">
                    <div class="mb-3">
                        <label for="personalEmailInput" class="form-label fw-semibold small">Personal Email <span class="text-muted fw-normal">(for real-time updates)</span></label>
                        <input type="email" class="form-control" id="personalEmailInput" placeholder="you@example.com">
                    </div>
                    <div class="mb-3">
                        <label for="avatarInput" class="form-label fw-semibold small">Profile Picture</label>
                        <input type="file" class="form-control" id="avatarInput" accept="image/png,image/jpeg,image/webp">
                    </div>
                    <button type="submit" class="btn btn-success fw-semibold px-4">Save Changes</button>
                    <span class="small text-success ms-2 d-none" id="saveConfirm">Saved!</span>
                </form>
            </div>

            <div class="text-center mt-4">
                <a href="../login.html" class="small">Need to change your password? Use "Forgot Password" on the login page.</a>
            </div>
        </main>
    </div>

    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script>
        const { token, user } = requireSession('../login.html');
        document.getElementById('profileName').textContent = user.full_name;
        document.getElementById('idNumberVal').textContent = user.id_number;

        async function load() {
            const data = await authedFetch('/api/auth/profile', token);
            if (!data.success) return;
            document.getElementById('emailVal').textContent = data.profile.email;
            document.getElementById('sectionVal').textContent = data.profile.section || '—';
            document.getElementById('profileSection').textContent = data.profile.section || '—';
            document.getElementById('personalEmailInput').value = data.profile.personalEmail || '';
            if (data.profile.profilePictureUrl) {
                document.getElementById('avatarImg').src = data.profile.profilePictureUrl;
                document.getElementById('avatarImg').classList.remove('d-none');
                document.getElementById('avatarIcon').classList.add('d-none');
            }

            const statusData = await authedFetch('/api/auth/status-summary', token);
            if (statusData.success) {
                document.getElementById('semesterVal').textContent = statusData.summary.semester || '—';
                document.getElementById('schoolYearVal').textContent = statusData.summary.schoolYear || '—';
            }

            loadBadges();
        }
        load();

        async function loadBadges() {
            const data = await authedFetch(`/api/badges/student/${user.id}`, token);
            if (!data.success) return;

            // Small icon row in the banner, like a game profile's badge strip.
            const strip = document.getElementById('bannerBadgeStrip');
            strip.innerHTML = data.badges.slice(0, 6).map(b => `
                <span class="d-inline-flex align-items-center justify-content-center rounded-circle"
                      style="width: 26px; height: 26px; background:${b.bg || '#f1f1f1'}; color:${b.color || '#333'}; font-size: 0.8rem;"
                      title="${b.name}">
                    ${b.icon ? `<i class="bi ${b.icon}"></i>` : (b.symbol || '★')}
                </span>
            `).join('');

            // Full badge grid further down the page.
            const grid = document.getElementById('profileBadgeGrid');
            if (!data.badges.length) {
                document.getElementById('profileEmptyBadges').classList.remove('d-none');
                return;
            }
            grid.innerHTML = data.badges.map(b => `
                <div class="col-4 col-sm-3">
                    <div class="text-center p-2 rounded-3" style="background:${b.bg || '#f1f1f1'}; color:${b.color || '#333'};" title="Earned ${new Date(b.earned_at).toLocaleDateString()}">
                        <div class="fs-4">${b.icon ? `<i class="bi ${b.icon}"></i>` : (b.symbol || '★')}</div>
                        <div class="small fw-semibold mt-1" style="font-size: 0.7rem;">${b.name}</div>
                    </div>
                </div>
            `).join('');
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('editProfileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const personalEmail = document.getElementById('personalEmailInput').value.trim();
            const avatarFile = document.getElementById('avatarInput').files[0];
            const payload = { personalEmail };
            if (avatarFile) payload.avatarBase64 = await fileToBase64(avatarFile);

            const data = await authedFetch('/api/auth/profile', token, {
                method: 'PATCH',
                body: JSON.stringify(payload),
            });
            if (!data.success) {
                alert(data.message);
                return;
            }
            const confirm = document.getElementById('saveConfirm');
            confirm.classList.remove('d-none');
            setTimeout(() => confirm.classList.add('d-none'), 2500);
            load();
        });
    </script>
</body>
</html>
