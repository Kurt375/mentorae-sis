<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Learning Resources</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard_student.css">
    <style>
        .file-row { border: 1px solid #e9ecef; border-radius: 0.5rem; padding: 0.6rem 0.9rem; }
        .file-row + .file-row { margin-top: 0.5rem; }
        .module-card { border: 1px solid #e9ecef; border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1rem; }
    </style>
</head>
<body class="dashboard-bg">
    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        <nav class="custom-navbar text-white py-3 px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard_student.html" class="text-white text-decoration-none fs-4"><i class="bi bi-chevron-left"></i></a>
                <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                    <img src="TSHS_image.png" alt="School Logo" class="school-logo-img">
                </div>
                <div>
                    <h1 class="m-0 fs-4 fw-bold tracking-wide">Learning Resources</h1>
                    <p class="m-0 micro-text opacity-75">Study materials</p>
                </div>
            </div>
            <select class="form-select form-select-sm w-auto" id="quarterFilter">
                <option value="">All quarters</option>
                <option value="1st Quarter">1st Quarter</option>
                <option value="2nd Quarter">2nd Quarter</option>
                <option value="3rd Quarter">3rd Quarter</option>
                <option value="4th Quarter">4th Quarter</option>
            </select>
        </nav>
        <main class="container-fluid px-4 py-4 flex-grow-1">
            <div id="modulesList">
                <p class="text-muted small">Loading…</p>
            </div>
        </main>
    </div>
    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script src="resources_student.js"></script>
</body>
</html>
