<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Grade &amp; Performance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard_student.css">
    <style>
        .grade-card { border: 1px solid #e9ecef; border-radius: 0.85rem; padding: 1.25rem; margin-bottom: 1rem; }
        .mini-bar-label { font-size: 0.72rem; display: flex; justify-content: space-between; margin-bottom: 2px; }
        .mini-bar { height: 6px; border-radius: 3px; background: #eee; overflow: hidden; margin-bottom: 0.6rem; }
        .mini-bar-fill { height: 100%; border-radius: 3px; }
        .goal-panel { background: #f8f9fa; border-radius: 0.6rem; padding: 0.9rem 1rem; margin-top: 0.75rem; }
        .goal-slider-val { font-weight: 700; font-size: 1.1rem; }
        .remarks-badge { font-size: 0.72rem; padding: 0.3rem 0.6rem; }
    </style>
</head>
<body class="dashboard-bg">
    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        <nav class="custom-navbar text-white py-3 px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard_student.html" class="text-white text-decoration-none fs-4"><i class="bi bi-chevron-left"></i></a>
                <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                    <img src="TSHS_image.png" alt="School Logo" class="school-logo-img">
                </div>
                <div>
                    <h1 class="m-0 fs-4 fw-bold tracking-wide">Grade &amp; Performance</h1>
                    <p class="m-0 micro-text opacity-75">Your academic records</p>
                </div>
            </div>
            <div class="text-white text-end dashboard-time">
                <div class="small opacity-75" id="liveDate"></div>
                <div class="fs-4 fw-bold m-0" id="liveTime"></div>
            </div>
        </nav>

        <main class="container-fluid px-4 py-4 flex-grow-1">
            <div class="card border-0 shadow-sm p-4 mb-4">
                <div class="row align-items-center g-3">
                    <div class="col-12 col-sm-4 text-center text-sm-start">
                        <span class="text-muted fw-semibold tiny-text text-uppercase">Overall Grade</span>
                        <h2 class="fw-bold fs-1 text-dark m-0" id="overallGradeVal">—</h2>
                        <span class="badge remarks-badge" id="overallRemarksBadge"></span>
                    </div>
                    <div class="col-12 col-sm-8">
                        <div class="progress" style="height: 10px;">
                            <div class="progress-bar" id="overallProgressBar" role="progressbar" style="width: 0%;"></div>
                        </div>
                        <p class="text-muted small mt-2 mb-0" id="overallSubtitle">No grades posted yet.</p>
                    </div>
                </div>
            </div>

            <h5 class="fw-bold mb-3">By Subject</h5>
            <div id="gradesList">
                <p class="text-muted small">Loading…</p>
            </div>
        </main>
    </div>

    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script src="grades_student.js"></script>
</body>
</html>
