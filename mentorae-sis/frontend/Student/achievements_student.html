<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Achievements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard_student.css">
    <style>
        .badge-tile { border-radius: 14px; padding: 16px; text-align: center; }
        .badge-tile .icon { font-size: 28px; margin-bottom: 8px; }
        .activity-row { padding: 10px 0; border-bottom: 1px solid #eee; font-size: 13px; }
        .activity-row:last-child { border-bottom: none; }
    </style>
</head>
<body class="dashboard-bg">
    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        <nav class="custom-navbar text-white py-3 px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard_student.html" class="text-white text-decoration-none fs-4"><i class="bi bi-chevron-left"></i></a>
                <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                    <img src="TSHS_image.png" alt="School Logo" class="school-logo-img">
                </div>
                <div>
                    <h1 class="m-0 fs-4 fw-bold tracking-wide">Achievements</h1>
                    <p class="m-0 micro-text opacity-75">Points &amp; badges</p>
                </div>
            </div>
        </nav>

        <main class="container-fluid px-4 py-4 flex-grow-1">
            <div class="row g-3 mb-4">
                <div class="col-6">
                    <div class="card border-0 shadow-sm p-3 text-center">
                        <span class="text-muted tiny-text text-uppercase">Badges Earned</span>
                        <h2 class="fw-bold fs-2 m-0" id="badgeCountVal">—</h2>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm p-3 mb-4">
                <h5 class="fw-bold mb-3">Your Badges</h5>
                <div class="row g-3" id="badgeGrid"></div>
                <p class="text-muted small text-center py-3 d-none" id="emptyBadges">No badges yet — keep attending class and doing well on your grades to earn your first one!</p>
            </div>

            <div class="card border-0 shadow-sm p-3">
                <h5 class="fw-bold mb-3">Recent Activity</h5>
                <div id="activityList"></div>
                <p class="text-muted small text-center py-3 d-none" id="emptyActivity">No recent activity yet.</p>
            </div>
        </main>
    </div>

    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script>
        const { token, user } = requireSession('../login.html');

        async function load() {
            const data = await authedFetch(`/api/badges/student/${user.id}`, token);
            if (!data.success) return;

            document.getElementById('badgeCountVal').textContent = data.badges.length;

            const grid = document.getElementById('badgeGrid');
            if (!data.badges.length) {
                document.getElementById('emptyBadges').classList.remove('d-none');
            } else {
                for (const b of data.badges) {
                    const col = document.createElement('div');
                    col.className = 'col-6 col-sm-4';
                    col.innerHTML = `
                        <div class="badge-tile" style="background:${b.bg || '#f1f1f1'}; color:${b.color || '#333'};">
                            <div class="icon">${b.icon ? `<i class="bi ${b.icon}"></i>` : (b.symbol || '★')}</div>
                            <div class="fw-bold small">${b.name}</div>
                        </div>
                    `;
                    grid.appendChild(col);
                }
            }

            const activityList = document.getElementById('activityList');
            if (!data.activity.length) {
                document.getElementById('emptyActivity').classList.remove('d-none');
            } else {
                for (const item of data.activity) {
                    const row = document.createElement('div');
                    row.className = 'activity-row';
                    row.innerHTML = `<span>${item.description}</span>`;
                    activityList.appendChild(row);
                }
            }
        }
        load();
    </script>
</body>
</html>
