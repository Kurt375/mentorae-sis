<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorae - Schedule Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="schedule_management_admin.css">
</head>
<body class="dashboard-bg">

    <div class="portal-wrapper shadow-sm min-vh-100 d-flex flex-column bg-white">
        
        <header class="custom-navbar text-white py-3 px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard_admin.html" class="text-white text-decoration-none fs-4" id="backToDashboardBtn" aria-label="Go Back">
                    <i class="bi bi-chevron-left"></i>
                </a>
                <div class="bg-white rounded-circle d-flex align-items-center justify-content-center logo-wrap">
                    <img src="TSHS_image.png" alt="School Logo" class="school-logo-img">
                </div>
                <div>
                    <h1 class="m-0 fs-4 fw-bold tracking-wide">Schedule Management</h1>
                    <p class="m-0 micro-text opacity-75">Assign and view class schedules</p>
                </div>
            </div>
            <div class="text-white text-end dashboard-time">
                <div class="small opacity-75" id="liveDate"></div>
                <div class="fs-4 fw-bold m-0" id="liveTime"></div>
            </div>
        </header>

        <main class="container-fluid px-4 py-4 flex-grow-1 bg-light-green">
            
            <section class="card border-0 rounded-3 p-4 mb-4 shadow-sm">
                <span class="badge bg-mentorae-green text-white align-self-start mb-3 px-3 py-2 fs-6 rounded-2 fw-medium">Create Schedule</span>
                
                <form id="createScheduleForm" novalidate>
                    <div class="row g-3">
                        <div class="col-12 col-md-6 col-lg-3">
                            <label for="teacherSelect" class="form-label text-dark fw-bold micro-text mb-1">Teacher</label>
                            <select class="form-select form-input" id="teacherSelect" required></select>
                        </div>
                        <div class="col-12 col-md-6 col-lg-3">
                            <label for="subjectSelect" class="form-label text-dark fw-bold micro-text mb-1">Subject</label>
                            <select class="form-select form-input" id="subjectSelect" required></select>
                        </div>
                        <div class="col-12 col-md-6 col-lg-3">
                            <label for="strandSelect" class="form-label text-dark fw-bold micro-text mb-1">Strand</label>
                            <select class="form-select form-input" id="strandSelect" required></select>
                        </div>
                        <div class="col-12 col-md-6 col-lg-3">
                            <label for="sectionSelect" class="form-label text-dark fw-bold micro-text mb-1">Section</label>
                            <select class="form-select form-input" id="sectionSelect" required></select>
                        </div>
                        <div class="col-12 col-md-6 col-lg-3">
                            <label for="quarterSelect" class="form-label text-dark fw-bold micro-text mb-1">Quarter</label>
                            <select class="form-select form-input" id="quarterSelect" required>
                                <option value="1st Quarter">1st Quarter</option>
                                <option value="2nd Quarter">2nd Quarter</option>
                                <option value="3rd Quarter">3rd Quarter</option>
                                <option value="4th Quarter">4th Quarter</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-4 col-lg-3">
                            <label for="daySelect" class="form-label text-dark fw-bold micro-text mb-1">Day of Week</label>
                            <select class="form-select form-input" id="daySelect" required>
                                <option value="Monday">Monday</option>
                                <option value="Tuesday">Tuesday</option>
                                <option value="Wednesday">Wednesday</option>
                                <option value="Thursday">Thursday</option>
                                <option value="Friday">Friday</option>
                                <option value="All Weekdays">All Weekdays</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-4 col-lg-3">
                            <label for="startTime" class="form-label text-dark fw-bold micro-text mb-1">Start Time</label>
                            <input type="time" class="form-control form-input" id="startTime" min="07:00" max="15:30" required>
                            <div id="startTimeError" class="invalid-feedback tiny-text"></div>
                        </div>
                        <div class="col-12 col-md-4 col-lg-3">
                            <label for="endTime" class="form-label text-dark fw-bold micro-text mb-1">End Time</label>
                            <input type="time" class="form-control form-input" id="endTime" min="07:00" max="15:30" required>
                            <div id="endTimeError" class="invalid-feedback tiny-text"></div>
                        </div>
                        <div class="col-12 col-lg-3 d-flex align-items-end">
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold d-inline-flex align-items-center justify-content-center gap-2 shadow-sm">
                                <i class="bi bi-plus-lg"></i> Create Schedule
                            </button>
                        </div>
                    </div>
                </form>
            </section>

            <div class="card border-0 shadow-sm overflow-hidden rounded-3">
                <div class="p-3 border-bottom bg-white d-flex justify-content-between align-items-center">
                    <h3 class="h6 fw-bold m-0 text-dark text-uppercase tracking-sm">Master Schedule</h3>
                    <div class="input-group" style="max-width: 300px;">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control border-start-0" id="scheduleSearch" placeholder="Search schedule...">
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped text-sm align-middle m-0" id="scheduleTable">
                        <thead>
                            <tr class="table-header-row text-white">
                                <th class="px-3 py-2.5">Teacher</th>
                                <th class="px-3 py-2.5">Subject</th>
                                <th class="px-3 py-2.5">Strand & Section</th>
                                <th class="px-3 py-2.5">Quarter</th>
                                <th class="px-3 py-2.5">Day</th>
                                <th class="px-3 py-2.5">Time</th>
                                <th class="px-3 py-2.5 text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="session.js"></script>
    <script src="schedule_management_admin.js"></script>
</body>
</html>
